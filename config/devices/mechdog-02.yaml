# 개체 프로파일 — mechdog-02 (WBS 2.4.1)
#
# `mechdog-02` 라는 번호는 `2.4.1` 을 닫으면서(2026-10-05) 그대로 확정했다.
# **실제 신원은 아래 MAC 이다** — 번호가 바뀌어도 `telemetry_device_id` 는
# 그 보드 하나만 가리킨다.
#
# ⚠️ **이 기체는 `mechdog-01` 과 같은 모델이지만 다른 물체다.** 두 기체의 값을
# 서로 복사하지 않는다 — 서보 오프셋 비대칭이 개체마다 다르고, 그 차이가 곧
# 속도·선회율·직진 편향의 차이로 나온다(CONTRIBUTING 6절). 실제로 **직진
# 편향의 방향부터 반대다** — `mechdog-01` 은 좌, 이 기체는 우다(아래 참조).
# 복사했으면 보정이 편향을 두 배로 키웠을 자리다.

device_id: mechdog-02
owner_id: unassigned # prod 프로파일로 올릴 때 실제 담당자로 채운다

# 부팅 UART 의 `Telemetry identity:` 줄에서 읽었다. 2026-09-11·09-13 측정 로그에
# 같은 값이 찍혀 있다. 보드(ESP32)를 바꾸면 이 값도 바뀐다.
telemetry_device_id: mechdog-3c8a1f1d80cc

# LiDAR(1대뿐)를 이 기체에 단다 — Phase 2 기준기이자 시연 기체다 (2026-09-29 · CONTRIBUTING 1절).
reference_role: phase2

network:
  # 실측 전이다. **틀린 주소가 적혀 있는 것이 비어 있는 것보다 나쁘다** —
  # `2.4.2` 에서 확정한다.
  mechdog_ip: null
  xiao_ip: null
  cmd_port: 5001
  telemetry_port: 5101

# ⚠️ **아직 재지 않았다 — 0 이 아니라 `null` 이다.**
#
# 0 아홉 개는 *"보정이 필요 없다"* 는 뜻이 되어 버리고, 이 값은 유실 대비
# 보관본이므로(호스트는 읽기만 하고 로봇에 보내지 않는다) 틀린 기록이 그대로
# 남는다. 없는 것과 0 인 것은 다르다.
#
# `mechdog-01` 의 `[0, -36, -82, -14, -97, 3, 100, 36, 62]` 를 복사하지 않는다.
# 그 값은 그 개체의 서보 편차이며 이 기체에 넣으면 더 비뚤어진다.
# 2026-10-04 기체 NVS 에서 직접 읽고 고친 값 (MAC 3c:8a:1f:1d:80:cc, [0]=조향, [1..8]=서보 ID1..8).
# 09-06 MechDog V1.3 Read Deviation 값과 같았으나 순정 펌웨어가 i8 로 저장해 우리 펌웨어(getInt=i32)가
# 0 으로 읽고 있었다 — 같은 값을 i32 로 다시 써서 적용(tools/probe/nvs_servo_offsets.py).
# ID7 은 앞발 정렬(왼발 0.5cm 앞)로 −5 → −20 (사용자 눈 확인 «거의 나란»). 이 값은 기록용이다 —
# 실제 적용은 기체 NVS 에서 하며, 바꿀 때는 이 줄도 같이 고친다.
servo_offset: [0, 10, -8, -10, 67, 75, 16, -20, -15]

gait_calibration:
  # 2026-09-21/22 실측 — 실내 장판 검정 테이프 구역, 3초 창 ×3회.
  # 전진은 두 세션에서 갈렸다: 09-21 73.8(220/215/237mm) 대 09-22 68.7
  # (215/210/193mm). 최신 세션 값을 적고, 세션 간 7% 차이는 배터리·발 미끄럼
  # 수준의 변동으로 본다.
  forward_mm_per_sec: 68.7
  # ⚠️ **후진이 전진보다 빠르다 (83.8 vs 68.7, +22%).** "후진 = 전진" 가정은
  # 이 기체에서도 성립하지 않는다 — 회피 후진 시간을 전진 속도로 계산하면
  # 목표보다 더 물러난다.
  reverse_mm_per_sec: 83.8
  # 좌선회 외부 나침반 실측 4회 평균 (14.0/7.0/9.4/10.0 도/s). 회피는
  # +turn_angle_deg(좌선회)만 쓴다. ⚠️ 3초 창 값이다 — mechdog-01 에서 선회율은
  # 창이 길수록 커졌으므로(5.2초→6.8, 12초→7.7) 이 값은 보수적일 수 있다.
  # 우선회 대조: -10.0 도/s (n=3, -28/-32/-30도) — 좌우 대칭에 가깝다.
  turn_deg_per_sec: 10.1
  # 후진+좌선회 `move(-60,+20)` 실측 — 회피 시퀀스가 쓰는 방향(ADR-29).
  # ⚠️ **분산이 크다** — 3회가 1.1/9.3/14.7 도/s (2회차는 발 미끄럼으로 거의
  # 무동작). 평균 8.4 를 쓰되 실제 회피 각도는 이보다 적게 돌 수 있다.
  reverse_turn_deg_per_sec: 8.4
  # 후진 선회 중 후퇴: 3회 현 길이 합 398mm / 9.1s = 43.7 mm/s.
  reverse_turn_mm_per_sec: 43.7
  measured_on: "2026-09-22"

  # ⚠️ **직진이 오른쪽으로 휜다 — `mechdog-01` 과 방향이 반대다.**
  #
  # 조종자가 영상을 찍은 계기가 *"직진할 때 오른쪽으로 휘는 느낌"* 이었고,
  # 2026-09-11 폰 자이로도 직진 4개 구간이 전부 우, 후진 4개 구간도 전부 우였다.
  # `mechdog-01` 은 좌 1.0 도/s 다. **같은 모델이어도 편향 방향이 갈린다** —
  # WBS 2.2.3 이 *"이 비대칭은 기체마다 방향도 크기도 다르게 나온다"* 고 적어 둔
  # 그대로다.
  #
  # 2026-09-22 실측 — 발 기준선 이탈로 산출한 3회 외부값 -11.8/-2.7/-10.6도
  # ÷ 3초 창 → 평균 -2.8 도/s 우편향(음수=우측). 09-11 폰 자이로(-1.5~-4.8도)
  # 와 방향 일치. 눈대중 추정(-2~-4도)보다 큰 편향이 확인됐다.
  forward_yaw_drift_deg_per_sec: -2.8
  # ⚠️ **straight_bias_deg 는 여전히 비워 둔다.** 편향을 상쇄하는 angle 바이어스를
  # 찾으려면 `--bias-deg` 스윕으로 "방향 변화 0 이 되는 각도"를 재야 한다 —
  # 편향 크기(-2.8 도/s)가 아니라 명령 각도(deg)가 들어가는 키다. 데드밴드가
  # 있을 수 있어 실측 없이 선형 외삽하지 않는다.
  straight_bias_deg: null

  # ⚠️ **출발할 때마다 코가 오른쪽으로 채인다 (2026-09-11).** 직진 구간 4개 중
  # 둘에서 첫 0.5초에 -6.3 도/s 가 나오고 그 뒤에는 거의 0 이었다 — 회당 약
  # 2~3도의 **출발 킥**이며 지속 편향과 다른 현상이다. 10초 창으로 재면 희석돼
  # 보이지 않는다. **순찰이 서다 가다를 반복하면 출발마다 쌓인다.**
  # 확정하려면 출발만 반복해 재야 한다.

  # 트롯 보행 중 몸체 자세 진폭 (WBS 2.2.3 ②). 스트라이드 한 주기 안의
  # **반진폭** `(max - min) / 2` 다 — 피크투피크는 2배다.
  #
  # 2026-09-11 폰(phyphox) 자이로 99.4Hz 측정을 2026-09-13 에 정리했다.
  # 직진·후진·좌회전·우회전 179 사이클이며, 활동 구간은 `05_실물_측정결과/
  # 2026-09-11/` 의 기존 구간 분석을 그대로 썼다(재분할 없음). 전체 보고서와
  # 재현 스크립트가 거기 있다.
  #
  # ⚠️ **폰이지 온보드 IMU 가 아니다.** 폰을 등에 벨크로로 강결합했으므로 몸체
  # 진폭은 같게 나오지만, `4.1.4` 텔레메트리가 오면 장착 위치·강성 차이만큼
  # 달라질 수 있다. 그때 같은 형식으로 다시 재고 이 값을 대체한다.
  #
  # ⚠️ **롤이 피치보다 크다** — p95 에서 1.4배다. 트롯은 대각 두 다리가 함께
  # 나가므로 좌우로 기우는 쪽이 더 흔들린다. **마스트는 롤을 기준으로 본다.**
  #
  # ⚠️ **`FR-6.2.2` 보행 중 측위가 이 값에 걸려 있었다**(`OI-24`). 스캔면이
  # 스트라이드당 p95 +-2.6도, 최악 +-4.2도 기울므로 마스트 높이 h 에서 바닥
  # 교점이 `h x tan(4.2도) ~= 0.073h` 만큼 움직인다 — 마스트 20cm 면 약 1.5cm 다.
  # **이 기체 기준이며 `mechdog-01` 에 그대로 적용하지 않는다.**
  posture_amplitude:
    # 스트라이드 주파수. 네 파일 스펙트럼 피크가 2.75~2.80Hz 로 모였다.
    # ⚠️ **명령보다 20% 느리다** — 전역 설정의 `lift 120ms + ground 180ms
    # = 300ms` 는 3.33Hz 인데 실제는 2.77Hz(361ms)다. 서보가 명령 주기를
    # 못 따라간다. 5.55Hz 피크는 2배 고조파다(트롯에서 대각 두 쌍이 한
    # 스트라이드에 각각 밟는다).
    stride_hz: 2.77
    pitch_p95_deg: 1.84
    pitch_max_deg: 2.67
    roll_p95_deg: 2.62
    roll_max_deg: 4.19
    cycles: 179
    # 폰 기준임을 값 옆에 남긴다 — 주석은 복사 중에 떨어져 나가지만 키는 남는다.
    source: phone_imu
    measured_on: "2026-09-11"

  measured_on: "2026-09-11"

measured:
  body_weight_g: null # H3 은 합·불만 보므로 무게를 재지 않는다
  payload_pass_g: null
  runtime_min: null
  wifi_rssi_dbm: null


# ── 측위 (Phase 2) ────────────────────────────────────────────
# ⚠️ **이 기체만 `lidar` 다.** 전역 `config.yaml` 은 Phase 1 표준 구성이라
# `track: none` 으로 남긴다 — LiDAR 가 없는 기체에서 측위를 요구하면 기동이
# 막힌다. LD19 는 이 기체 한 대에만 달려 있고(`reference_role: phase2`),
# `settings.require_lidar_track` 이 실기 매핑·순찰에서 이 값을 본다.
localization:
  track: lidar

# ══════════════════════════════════════════════════════════════
#  현장 운용 설정 — 2026-10-06 주행본 (그때까지 `mechdog-02.local.yaml` 로컬 전용이던 값)
#
#  10-06 시연 동선 완주·쓰러짐·PPE·안내음 실기에 쓴 그대로다. 다른 PC 로 옮겨도 같은 동작이
#  나오도록 저장소로 올렸다(지도 `maps/`, 위험물 후보 모델은 `tools/fetch_models.py`).
#  기체 IP 만 로컬 파일(`mechdog-02.local.yaml`, gitignore)에 둔다 — 공유기마다 바뀐다.
# ══════════════════════════════════════════════════════════════
zones:
  arrival_radius_mm: 250  # 2026-10-06 동선 주행: 15cm 는 보폭으로 수렴 못 해 정지점 앞에서 맴돎(A 에서 1분). 이전 150
  # 2026-10-06 사용자 결정: PPE 는 항상 판정, 착용 «필수» 는 C 주방만(가장 넓어 PPE 장면). A 작업실은 위험물 감지.
  policies:
    A: {helmet: false, vest: false}
    B: {helmet: false, vest: false}
    C: {helmet: true, vest: true}
    D: {helmet: false, vest: false}
  # 2026-10-06 리허설2: 작업실에서 위치 상실(구역 불명) → 기본 «둘 다 필수»로 사람에게 PPE 경고가 나감. 불명은 필수 아님.
  unknown_policy: {helmet: false, vest: false}
  sticky_last_zone: true  # 2026-10-06 촬영2: 주방에서 위치 상실 → PPE 판정 빠짐. 마지막으로 알던 구역 정책 유지
  hazard_ids: [A]
  ids: [B, C, D, A]  # 2026-10-04 실기: 거실→주방→침실→작업실 순서로 계속 순찰 (사용자 지정 순서)
lidar:
  scan_tilt_roll_offset_deg: 3.5  # 2026-10-06 실기: 정지 자세 roll 3.0~4.1°(설치·영점) — 6° 한도에 걸려 정지 중 스캔 거절·LOST 반복
  scan_tilt_max_deg: 8  # 정지 한도 6→8 (SCAN pitch −15° 는 계속 거절)
  waypoint_radius_mm: 200  # 2026-10-06 동선 중간점 통과 판정 완화(기본 100)
  pose_out_port: 5398  # 2026-10-05 집 SIM(8788) 실시간 위치: pose_to_map_pose(5398) → MAP_POSE 5206 → astra 브리지. 원래 5300
  # 2D 순찰 지도 (출발 자리 원점 · 서쪽을 보고 출발) — 2026-10-06 사용자 결정으로 저장소에 둔다(공개).
  # 2026-10-04 통합 지도 v2(여유 수정본, 목업 검증) 로 교체. 되돌리기: 아래 주석의 기존 경로.
  maps_dir: "maps/home_20261006_remap2"  # 저장소에 들어 있는 시연 장소 지도(작업실·가벽 보정 remap2). 실행 위치는 저장소 루트
posture:
  # IMU 정지 roll 편향 상쇄. ⚠️ 명령 roll 부호는 IMU 와 **반대** (2026-10-03 실측:
  # -4.0→IMU+5.9°, -10.0→IMU+12.2°, +2.0→IMU+2.0°). 10-02 에 넣은 -4.0 이 오히려
  # 기울기를 만들고 있었음 — 0 으로 되돌려 해로운 입력 제거. 정확한 잔차 편향은
  # 평지에서 재측정 후 소수(+1~+2 범위 추정)로 다시 넣는다.
  # 2026-10-04 서서 스윕 실측(straight_lidar --roll-sweep): POSE 0→IMU +3.06°, +2→+1.91°, +4→+0.22°, +6→−2.38°
  # 선형 맞춤 기울기 −0.90, 수평 명령 +3.78 (잔차 0.36°). 되돌리기: 0.0
  # 2026-10-04 서보 편차(i32) 적용 뒤 재측정: POSE 0→+1.01°, +2→+0.49°, +4→−1.76°, +6→−4.25° → 수평 +1.75.
  # 편차가 대부분을 잡았다. 직전 값 3.8 (편차 미적용 시절).
  roll_offset_deg: 1.8  # 2026-10-04 21:3x 보행 영상: 3.8→왼쪽 약 5.5°, 0→오른쪽 약 4.5° → 보행 수평 ≈ 1.7 (정지 수평계 판정은 폰 위치로 흔들려 기각)
vision:
  coco:
    conf_threshold: 0.35  # 2026-10-06 실기: 거실 바닥에 누운 사람이 0.5 근처(0.55)로 10프레임 중 1번만 잡혀 쓰러짐 판정 불가 → 완화
  hazard:
    confirm_window_ms: 4000  # 2026-10-06 마지막 리허설: 위험구역 정지 시간을 1.5초→4초(검출 기회 늘림). 실측상 모델이 실물을 거의 못 잡음
    conf_threshold: 0.5  # 2026-10-06 합성 학습 모델로 의자·PC·쓰레기통 오검출이 사라져 0.4→0.5 복귀
    min_box_side_px: 22  # 2026-10-06 PC 본체 빨간 표시(16px) 오검출 → 긴 변 22px 미만 무시(실물 라이터 25~50px)
    model_path: "models/hazard_synth.onnx"  # 2026-10-06 로봇 시점 합성 학습 후보(Release hazard-synth-v2, tools/fetch_models.py). 실물 라이터 0.87~0.88, 보조배터리 미검출
  mount_rotation: 180  # 2026-10-04 XIAO 부팅 180 펌웨어(10-01 설치)를 호스트가 0 으로 덮어쓰지 않게
broadcast:
  enabled: false  # 2026-10-06 사용자: 경고는 PC 가 아니라 로봇 스피커로 → robot_sound

robot_sound:  # 2026-10-06 사건 → 로봇 MP3 모듈 TF 카드 트랙 (TF 카드 문장 표: experiments/wonderecho-audio/tf_tracks.tsv)
  repeat_after_ms: 5500  # 2026-10-06 리허설: ACK 는 왔는데 무음 1회 → 경고를 5.5초 뒤(가장 긴 문장 4.8초) 한 번 더
  tracks:
    person_fallen: 2        # 0002 작업자가 쓰러졌습니다. 관리자에게 통보되었습니다.
    hazard_notice: 193      # 0193 화기 위험물이 감지되었습니다. 치워 주세요. (둘 다·VLM)
    hazard_notice_lighter: 193    # 2026-10-06 사용자 결정②: 검출 이름이 오검출일 수 있어 물건 이름 없이 0193
    hazard_notice_powerbank: 193  # 같은 이유(실측: PC 본체를 보조배터리 0.92 로 오검출)
    ppe_violation_warning: 185  # 0185 안전모와 안전조끼를 착용해 주십시오.
    ppe_violation_helmet_warning: 188  # 0188 안전모를 착용해 주십시오. (안전모만 미착용)
    ppe_violation_vest_warning: 189    # 0189 안전조끼를 착용해 주십시오. (조끼만 미착용)
    path_blocked: 190       # 0190 길이 막혔습니다. 장애물을 치워 주세요.
    obstacle_detour: 187    # 0187 통로에 장애물이 있습니다. 치워 주세요. 돌아서 지나갑니다.
    ppe_settled: 194        # 0194 착용이 확인되었습니다. 감사합니다.
    route_started: 195      # 0195 순찰을 시작합니다.
    route_finished: 196     # 0196 순찰을 마쳤습니다. 관제에 결과를 보고했습니다.
    alarm_confirmed: 197    # 0197 관리자 확인이 완료되었습니다. 순찰을 계속합니다.
    ppe_unresolved: 198     # 0198 보호구 미착용이 계속되어 관제에 보고합니다.
    fall_suspected: 199     # 0199 괜찮으십니까? 움직일 수 있으면 손을 들어 주세요.
dashboard:
  scene3d_url: "http://127.0.0.1:8789/"  # 2026-10-06 통합 관제 3D 보기(로컬 house-sim-unified, node server.mjs)
mission:
  mode: guard  # 2026-10-06 PPE 시험 뒤 되돌림(factory 는 비전 필수)

nav:  # 2026-10-05 사용자 승인: 덜 조심스럽게. 코끝 기준 25cm부터 감속, 정지는 라이다 25cm(=코끝 약 14cm) 유지
  relaxed_follow: true  # 2026-10-06 사용자: 따라가기가 작업실에서 처음 나옴 → 유지. 휨은 dfba0ec(8° 넘으면 제자리 회전·그 안은 직진)로 대응
  local_slow_m: 0.36
  avoidance_m: 0.30
  avoidance_step_scale: 0.7
  avoidance_timeout_ms: 2000
  blockage_confirm_ms: 1000
  inflation_radius_m: 0.40
  route_person_search: true  # 2026-10-06 AX: 동선 점 search_deg 가 있는 곳(C)에서 좌우로 돌며 사람 찾기
  relaxed_walk_detour: true  # 2026-10-06 AX: 걸으며 비켜 가는 우회
  relaxed_detour_notice: true  # 우회 시작 때 «돌아서 지나갑니다» 1회
  relaxed_stuck_hold: true  # 2026-10-06 목업: 막히면 정면정지·탈출회전 무한반복 → 10초간 진척 없으면 «길이 막혔습니다» 1회 후 대기, 앞이 열리면 재개
  relaxed_stuck_ms: 10000

fsm:  # 2026-10-06 사용자: 걷다가 10초마다 고개 들기(상체 스캔)로 멈춤·동선 정지점 대기가 안 끝남 → 이동 중 주기 스캔 사실상 끔(정지점에서 검사)
  patrol_scan_interval_s: 600
  track_stop_dist_cm: 150  # 2026-10-06 리허설3: 쓰러짐 의심 때 40cm 까지 다가가 «돌진», 누운 사람이 화면에 안 들어옴 → 1.5m 에서 멈추고 방향만 맞춤
  hold_on_latched_alarm: true  # 2026-10-06 AX 사용자 승인: 쓰러짐 L3 동안 그 자리 대기, 관제 경보 확인 뒤 재개
escalation:  # 2026-10-06 AX: PPE 경고 뒤 같은 대상 착용 재확인
  ppe_recheck: true
  ppe_recheck_max_warnings: 2

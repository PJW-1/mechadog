name: CI

on:
  push:
    branches: [main, dev]
    # WBS 5.3.4 · release 잡은 refs/tags/v* 에서만 동작한다. 이 줄이 없으면
    # 태그 push 로 워크플로우 자체가 트리거되지 않아 릴리스가 생성될 수 없다.
    tags: ['v*']
  pull_request:
    branches: [main, dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── WBS 5.3.1 · Python 품질 ────────────────────────────────
  python-quality:
    name: Python Quality (ruff + pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      # requirements.txt 는 환경 마커로 플랫폼을 분기한다.
      # onnxruntime-directml 은 Windows 전용이므로 리눅스 러너에서는
      # onnxruntime(CPU)이 설치된다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # docs/ASSIGNMENTS.md 는 WBS 에서 생성된다. WBS 만 고치고 재생성하지 않으면
      # 담당자별 부하가 실제와 다르게 표시되므로 여기서 막는다.
      - name: Generated docs are up to date
        run: python tools/wbs_assignments.py --check

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: PC maintenance offline tests
        run: |
          python -m pip install -r tools/pc_control/requirements.txt
          python -m unittest discover -s tools/pc_control -p 'test_*.py'

      - name: Voice prototype offline tests
        run: |
          python -m pip install -r experiments/wonderecho-audio/requirements-pc.txt
          python -m unittest discover -s experiments/wonderecho-audio -p 'test_*.py'

      # 하드웨어 없이 검증 가능한 순수 로직만 대상 (WBS 6.2)
      #  · FSM 상태 전이 전수 검증
      #  · 메시지 직렬화 / 범위 클램핑 / seq 역전 폐기
      #  · 안전 판정 조건 조합
      #  · config 스키마 검증
      - name: Unit tests
        # 첫 Host 모듈(host/common/protocol.py · WBS 3.1.1)이 들어오면서 커버리지
        # 게이트를 켰다. 그 전에는 측정 대상이 없어 수치가 무의미했다.
        # GUI 시험(field_measure_ui·field_plan.gui)은 실제 tk 창을 띄우므로
        # 헤드리스 러너에서는 가상 디스플레이(xvfb)가 필요하다.
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb
          xvfb-run -a pytest -q --cov=host --cov=tools --cov-report=term-missing --cov-fail-under=80

  # ── WBS 5.3.2 · 펌웨어 정적 분석 ──────────────────────────
  firmware-quality:
    name: Firmware Quality (clang-format + cppcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Detect firmware sources
        id: detect
        run: |
          COUNT=$(find firmware_mechdog_motion firmware_xiao_vision \
                    firmware_lidar_relay \
                    -name '*.cpp' -o -name '*.h' -o -name '*.ino' 2>/dev/null | wc -l)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "펌웨어 소스 $COUNT 개 발견"

      - name: Install tools
        if: steps.detect.outputs.count != '0'
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck clang-format

      # 스타일 위반 시 실패한다
      - name: Format check
        if: steps.detect.outputs.count != '0'
        run: |
          find firmware_mechdog_motion firmware_xiao_vision \
               firmware_lidar_relay \
               \( -name '*.cpp' -o -name '*.h' -o -name '*.ino' \) \
               -not -path '*/third_party/*' -print0 \
            | xargs -0 -r clang-format --dry-run --Werror

      # ⚠️ --error-exitcode=1 : 문제 발견 시 반드시 실패한다.
      #    (구 워크플로우는 0으로 두어 어떤 문제도 잡히지 않았다 — 아키텍처 4.1)
      - name: Static analysis (cppcheck)
        if: steps.detect.outputs.count != '0'
        run: |
          cppcheck --enable=warning,style,performance,portability \
                   --suppress=missingIncludeSystem \
                   --inline-suppr \
                   --error-exitcode=1 \
                   -i third_party \
                   firmware_mechdog_motion firmware_xiao_vision \
                   firmware_lidar_relay

      # ── WBS 4.1.3 · C++ 파서 골든 픽스처 대조 ────────────────
      #
      #  CONTRIBUTING 5.2 가 요구하는 "C++ 파서를 호스트 컴파일로 픽스처와 대조"
      #  가 여기서 실제로 돈다. Python 쪽(test_protocol_fixtures.py)과 **같은
      #  파일**을 읽으므로, 스키마를 한쪽만 바꾸면 둘 중 하나가 반드시 깨진다.
      #
      #  실물 없이 도는 것이 요점이다 — 펌웨어 로직을 로봇 3대에 의존하지 않고
      #  매 PR 마다 검증한다 (HAL 분리 원칙).
      - name: Host unit test (command parser)
        if: hashFiles('firmware_mechdog_motion/test/*.cpp') != ''
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -Werror -O1 \
              -I firmware_mechdog_motion/src \
              firmware_mechdog_motion/src/command_parser.cpp \
              firmware_mechdog_motion/test/test_command_parser.cpp \
              -o build/test_command_parser
          ./build/test_command_parser tests/fixtures

      - name: Host unit test (OTA health window)
        run: |
          mkdir -p build
          g++ -std=c++11 -Wall -Wextra -Werror -O1 \
              -I firmware_mechdog_motion/src \
              firmware_mechdog_motion/test/test_ota_health.cpp \
              -o build/test_ota_health
          ./build/test_ota_health

      - name: Host unit test (OTA reboot deadline)
        run: |
          mkdir -p build
          g++ -std=c++11 -Wall -Wextra -Werror -O1 \
              -I firmware_mechdog_motion/src \
              firmware_mechdog_motion/test/test_reboot_deadline.cpp \
              -o build/test_reboot_deadline
          ./build/test_reboot_deadline

      - name: Host unit test (sensor timing statistics)
        run: |
          mkdir -p build
          g++ -std=c++11 -Wall -Wextra -Werror -O1 \
              -I firmware_mechdog_motion/src \
              firmware_mechdog_motion/test/test_sensor_timing_stats.cpp \
              -o build/test_sensor_timing_stats
          ./build/test_sensor_timing_stats
      - name: Host unit test (independent loop watchdog, simulated time)
        run: |
          mkdir -p build
          g++ -std=c++11 -Wall -Wextra -Werror -O1 \
              -I firmware_mechdog_motion/test/watchdog_stubs \
              -I firmware_mechdog_motion/src \
              firmware_mechdog_motion/test/test_task_watchdog.cpp \
              -o build/test_task_watchdog
          ./build/test_task_watchdog

      - name: Host unit test (motion safety state)
        run: |
          mkdir -p build
          g++ -std=c++11 -Wall -Wextra -Werror -O1 \
              -I firmware_mechdog_motion/src \
              firmware_mechdog_motion/test/test_motion_safety_state.cpp \
              -o build/test_motion_safety_state
          ./build/test_motion_safety_state

      - name: Host unit test (onboard safety monitor)
        run: |
          mkdir -p build
          g++ -std=c++11 -Wall -Wextra -Werror -O1 \
              -I firmware_mechdog_motion/src \
              firmware_mechdog_motion/src/safety_monitor.cpp \
              firmware_mechdog_motion/test/test_safety_monitor.cpp \
              -o build/test_safety_monitor
          ./build/test_safety_monitor

      - name: Host unit test (telemetry encoder)
        if: hashFiles('firmware_mechdog_motion/test/test_telemetry_encoder.cpp') != ''
        run: |
          mkdir -p build
          g++ -std=c++11 -Wall -Wextra -Werror -O1 \
              -I firmware_mechdog_motion/src \
              firmware_mechdog_motion/src/command_parser.cpp \
              firmware_mechdog_motion/src/telemetry_encoder.cpp \
              firmware_mechdog_motion/test/test_telemetry_encoder.cpp \
              -o build/test_telemetry_encoder
          ./build/test_telemetry_encoder
          ./build/test_telemetry_encoder --emit-fixtures > build/telemetry-emitted.jsonl
          ./build/test_telemetry_encoder --emit-optional-fixtures > build/telemetry-optional.jsonl
          python3 - <<'PY'
          import json
          from pathlib import Path
          from host.common.protocol import TelemetryDecoder, Verdict

          decoder = TelemetryDecoder()
          records = Path('build/telemetry-emitted.jsonl').read_text(encoding='utf-8').splitlines()
          assert records, 'C++ encoder emitted no records'
          for line in records:
              result = decoder.validate(json.loads(line))
              assert result.verdict is Verdict.ACCEPT, result
          print(f'Python decoder accepted {len(records)} C++ telemetry records')
          optional = Path('build/telemetry-optional.jsonl').read_text(encoding='utf-8').splitlines()
          values = [json.loads(line) for line in optional]
          assert [value['flags'].get('obstacle') for value in values] == [False, None, True]
          decoder = TelemetryDecoder()
          for value in values:
              assert decoder.validate(value).verdict is Verdict.ACCEPT
          print('Python decoder accepted omitted/present obstacle fields')
          PY

      # ── LiDAR 중계 노드 — LD19 파서/스캔 조립/SCAN 인코더 ──────
      #  파이썬 수신측(lidar_link.ScanDecoder)의 규약 구현과 교차 검증한다.
      - name: Host unit test (LiDAR relay)
        if: hashFiles('firmware_lidar_relay/test/*.cpp') != ''
        run: |
          mkdir -p build
          g++ -std=c++17 -Wall -Wextra -Werror -O1 \
              -I firmware_lidar_relay/src \
              firmware_lidar_relay/src/ld19.cpp \
              firmware_lidar_relay/src/scan_encoder.cpp \
              firmware_lidar_relay/test/test_lidar_relay.cpp \
              -o build/test_lidar_relay
          ./build/test_lidar_relay
          ./build/test_lidar_relay --emit-fixtures > build/lidar-emitted.jsonl
          python3 - <<'PY'
          from pathlib import Path
          from host.common.lidar_link import ScanDecoder

          decoder = ScanDecoder()
          records = Path('build/lidar-emitted.jsonl').read_text(encoding='utf-8').splitlines()
          assert records, 'C++ encoder emitted no scan records'
          for line in records:
              result = decoder.decode(line)
              assert result.accepted, result
          print(f'ScanDecoder accepted {len(records)} C++ scan datagrams')
          PY

  # ── WBS 5.3.3 · 펌웨어 빌드 ───────────────────────────────
  firmware-build:
    name: Firmware Build (${{ matrix.target.name }})
    runs-on: ubuntu-latest
    needs: firmware-quality
    strategy:
      fail-fast: false
      matrix:
        target:
          - dir: firmware_mechdog_motion
            fqbn: 'esp32:esp32:esp32:FlashMode=dio,FlashFreq=40'
            core: 'esp32:esp32@2.0.12'
            name: 'MechDog-Motion'
          - dir: firmware_xiao_vision
            fqbn: 'esp32:esp32:XIAO_ESP32S3:PSRAM=opi'
            core: 'esp32:esp32'
            name: 'XIAO-Vision'
          - dir: firmware_lidar_relay
            fqbn: 'esp32:esp32:esp32:FlashMode=dio,FlashFreq=40'
            core: 'esp32:esp32@2.0.12'
            name: 'Lidar-Relay'
    steps:
      - uses: actions/checkout@v7

      - name: Detect sketch
        id: sketch
        run: |
          if find "${{ matrix.target.dir }}" -name '*.ino' | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::error::${{ matrix.target.dir }}에 ${{ matrix.target.name }} 스케치가 없습니다"
            exit 1
          fi

      - name: Setup arduino-cli
        if: steps.sketch.outputs.found == 'true'
        uses: arduino/setup-arduino-cli@v2

      - name: Install ESP32 core
        if: steps.sketch.outputs.found == 'true'
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls \
            https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "${{ matrix.target.core }}"

      # OI-5: HW_MechDog 라이브러리 라이선스 확인 후 third_party/ 벤더링 필요 (RISK-07)
      - name: Link vendored libraries
        if: steps.sketch.outputs.found == 'true'
        run: |
          mkdir -p "$HOME/Arduino/libraries"
          if [ -d third_party ]; then
            find third_party -mindepth 1 -maxdepth 1 -type d \
              -exec cp -r {} "$HOME/Arduino/libraries/" \;
          fi
          arduino-cli lib list || true

      - name: Compile
        if: steps.sketch.outputs.found == 'true'
        run: |
          arduino-cli compile \
            --fqbn "${{ matrix.target.fqbn }}" \
            --warnings all \
            --export-binaries \
            "${{ matrix.target.dir }}"

      - name: Compile task watchdog candidates (not release artifacts)
        if: steps.sketch.outputs.found == 'true' && matrix.target.dir == 'firmware_mechdog_motion'
        run: |
          arduino-cli lib install SensorLib@0.2.1 Madgwick@1.2.0
          arduino-cli compile --fqbn "${{ matrix.target.fqbn }}" \
            --build-property 'compiler.cpp.extra_flags=-DMECHADOG_ENABLE_TASK_WDT=1 -DMECHADOG_ENABLE_ACTUATORS=0' \
            --build-path "$RUNNER_TEMP/watchdog-motion" firmware_mechdog_motion
          arduino-cli compile --fqbn "${{ matrix.target.fqbn }}" \
            --build-property 'compiler.cpp.extra_flags=-DMECHADOG_ENABLE_TASK_WDT=1 -DMECHADOG_ENABLE_ACTUATORS=0 -DMECHADOG_ENABLE_SENSORS=1' \
            --build-path "$RUNNER_TEMP/watchdog-sensors" firmware_mechdog_motion
          arduino-cli compile --fqbn "${{ matrix.target.fqbn }}" \
            --build-property 'compiler.cpp.extra_flags=-DMECHADOG_ENABLE_TASK_WDT=1 -DMECHADOG_ENABLE_ACTUATORS=0 -DMECHADOG_ENABLE_SENSORS=1 -DMECHADOG_WATCHDOG_FAULT_PROBE=1' \
            --build-path "$RUNNER_TEMP/watchdog-live-probe" firmware_mechdog_motion
          arduino-cli compile --fqbn "${{ matrix.target.fqbn }}" \
            --build-property "compiler.cpp.extra_flags=-I$GITHUB_WORKSPACE/firmware_mechdog_motion/src" \
            --build-path "$RUNNER_TEMP/watchdog-probe" \
            firmware_mechdog_motion/diagnostics/watchdog_probe

      - name: Compile stationary OTA with loop watchdog (not a release artifact)
        if: steps.sketch.outputs.found == 'true' && matrix.target.dir == 'firmware_mechdog_motion'
        run: |
          arduino-cli compile --fqbn "${{ matrix.target.fqbn }}" \
            --build-property "compiler.cpp.extra_flags=-include $GITHUB_WORKSPACE/firmware_mechdog_motion/test/ota_compile_settings.h" \
            --build-path "$RUNNER_TEMP/watchdog-ota" firmware_mechdog_motion

      - name: Actuator watchdog only via runtime SERVICE mode
        if: steps.sketch.outputs.found == 'true' && matrix.target.dir == 'firmware_mechdog_motion'
        run: |
          # WBS 3.2.4 service-mode expansion: TASK_WDT+ACTUATORS is now legal —
          # the qualification moved from a compile-time ban to a runtime order
          # (park body + latch + block motion, then arm). Actuator builds
          # cannot compile in CI (vendor HW_MechDog library is local-only), so
          # guard the contract at source level:
          #  1) the sketch derives MECHADOG_SERVICE_MODE for TASK_WDT+ACTUATORS
          #  2) boot arming stays restricted to actuator-OFF builds
          #  3) the old hard compile ban is gone (service mode replaced it)
          sketch=firmware_mechdog_motion/firmware_mechdog_motion.ino
          grep -q 'define MECHADOG_SERVICE_MODE 1' "$sketch"
          grep -q 'MECHADOG_ENABLE_TASK_WDT && !MECHADOG_ENABLE_ACTUATORS' "$sketch"
          ! grep -q 'restricted to actuator-OFF diagnostic builds' "$sketch"

      - name: Upload artifacts
        if: steps.sketch.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ matrix.target.name }}
          path: |
            ${{ matrix.target.dir }}/build/**/*.bin
            ${{ matrix.target.dir }}/build/**/*.elf
          if-no-files-found: error

  # ── WBS 5.3.4 · 릴리스 ────────────────────────────────────
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [python-quality, firmware-build]
    permissions:
      contents: write
    steps:
      # 트리거는 `v*` 전부를 받으므로 SemVer 형식은 여기서 걸러야 한다.
      # 잘못된 태그가 빈 릴리스를 만들기 전에 잡에서 실패시킨다.
      - name: Verify tag is SemVer
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME}"
          semver='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if ! [[ "$tag" =~ $semver ]]; then
            echo "::error::태그 '$tag' 는 SemVer 가 아닙니다 — v<주>.<부>.<수> 형식(예: v1.2.3, v1.0.0-rc.1)만 릴리스합니다"
            exit 1
          fi
          echo "SemVer 태그 확인: $tag"

      - uses: actions/checkout@v7
        with:
          # Release tags must be verified against the release branch, including
          # reruns after main has advanced beyond the tagged commit.
          fetch-depth: 0

      - name: Verify tag was promoted to main
        shell: bash
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::release tag must point to a commit already promoted to main"
            exit 1
          fi

      - uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Verify release firmware
        shell: bash
        run: |
          for target in MechDog-Motion XIAO-Vision Lidar-Relay; do
            if ! find "artifacts/firmware-$target" -type f -name '*.bin' -print -quit | grep -q .; then
              echo "::error::$target 바이너리가 없습니다"
              exit 1
            fi
          done

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          # The repository default is dev; releases belong to the promoted main
          # line verified above.
          target_commitish: main
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: artifacts/**/*

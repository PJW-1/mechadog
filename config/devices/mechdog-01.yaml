# 개체 프로파일 — mechdog-01 (WBS 2.4.1 부분)
#
# 실측 원본은 저장소 밖(팀장 PC 백업 폴더 `servo_offset.txt`·`wifi_hardware_test.txt`)에
# 있다. **보정값을 여기 옮긴 이유는 한 대의 텍스트 파일에만 두면 그 PC 와 함께
# 사라지기 때문이다** — 잃으면 로봇이 비뚤게 걷고 다시 재야 한다.
#
# ⚠️ `2.4.1` 은 3대 전부를 요구하므로 아직 완료가 아니다. 나머지 2대는 L1·L2 몫이다.
# 확인 경위는 docs/HARDWARE.md 1절 참조.

device_id: mechdog-01
owner_id: unassigned # prod 프로파일로 올릴 때 실제 담당자로 채운다

# `2.4.1` 에서 3대의 역할을 함께 정한다. 그 전에는 어느 쪽도 아니다.
reference_role: none

network:
  # 2026-09-07 확인 때 받은 IP 는 `192.168.5.2` 였으나 그것은 XIAO 카메라 모듈의
  # AP(`HW_ESP32S3CAM`)가 준 주소다. **실제 운용 공유기에서는 달라지므로 적지 않는다**
  # — 틀린 주소가 적혀 있는 것이 비어 있는 것보다 나쁘다. `2.4.2` 에서 확정한다.
  mechdog_ip: null
  xiao_ip: null
  cmd_port: 5001
  telemetry_port: 5101

# MechDog_offset[9] — 0번은 steering, 1~8번은 PWM 서보.
# 2026-09-07 `COM9` 로 실측. 개체마다 다르므로 다른 기체에 복사하지 않는다.
servo_offset: [0, -36, -82, -14, -97, 3, 100, 36, 62]

# 보행 명령 대비 실제 이동량 (FR-6.4). **시연할 바닥에서 재야 한다** —
# 카펫과 장판에서 값이 달라진다.
gait_calibration:
  # 2026-09-11 실측 — 10초 창 3회(1050/1040/1040mm)에서 104.0 mm/s. 3.1초 창의
  # 103.9 와 일치하므로 **값이 창 길이에 무관하다** = 초기 가속이 섞이지 않는다.
  forward_mm_per_sec: 104.0
  # ⚠️ **직진이 왼쪽으로 휜다 — 요(회전)이며 횡슬립이 아니다.**
  #
  # 3.1초에 2도, 10초에 10도로 **각도가 시간에 비례해 자랐다.** 크랩(횡슬립)이면
  # 경로 기울기가 창 길이와 무관하게 일정하고 옆으로 밀린 양만 커진다 — 후진
  # 편향이 그 경우였다(225mm 당 우측 3~4cm, 기체는 계속 정면).
  #
  # ⚠️ **작아 보이지만 순찰에서는 크다** — 5m 직선은 48초이고 그동안 방향이 48도
  # 틀어져 경로를 약 2m 이탈한다. 즉 현재 상태로는 순찰이 벽으로 휜다.
  #
  # 요라서 `angle` 바이어스로 상쇄할 수 있다(크랩이면 각도로는 손을 못 댄다).
  # 보정값은 `--mode forward --bias-deg <각도>` 로 편향이 0 이 되는 값을 찾아
  # 정한다. **아직 소비자가 없다** — 순찰 직진 명령에 싣는 것은 그 실측 뒤다.
  forward_yaw_drift_deg_per_sec: 1.0
  # 2026-09-11 실측 — **후진이 전진보다 25% 느리다.** 회피 시퀀스가 후진 시간을
  # 전진 속도로 계산하고 있어 200mm 목표에서 50mm 가 부족했다.
  # 두 배터리 상태(저전압 77.4 / 만충 78.0)에서 같은 비율이 나와 전압 영향이 아니다.
  reverse_mm_per_sec: 78.0
  turn_deg_per_sec: 6.8
  # 2026-09-11 실측 — **후진하며 선회**(`move(-60, +20)`). 6.1초 창에서 40~41도를
  # 돌면서 420~430mm 물러났다. 선회 속도는 전진 선회(6.8)와 사실상 같은데
  # **여유는 벌어진다** — 회피 시퀀스가 이 조합을 쓰는 이유다(ADR-29).
  # 창 길이와 무관한 불변량은 **각도당 후퇴 10.5mm** 다.
  reverse_turn_deg_per_sec: 6.6
  reverse_turn_mm_per_sec: 69.7
  measured_on: "2026-09-11"

measured:
  body_weight_g: null # H3 은 합·불만 보므로 무게를 재지 않는다
  payload_pass_g: null
  runtime_min: null
  # 모듈 AP 에 거의 맞닿은 거리에서의 값이다. 시연 거리 값이 아니다.
  wifi_rssi_dbm: -15

<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="292" viewBox="0 0 1040 292" role="img" aria-labelledby="title description">
  <title id="title">MechDog 시스템 아키텍처</title>
  <desc id="description">XIAO 카메라는 MJPEG를, LiDAR 중계 노드는 UDP JSON 스캔을 Host PC에 보낸다. Host PC는 MechDog에 UDP JSON 명령을 10Hz로 보내고 텔레메트리를 10Hz로 받는다. 관제 브라우저와 Host PC는 WebSocket으로 양방향 통신한다.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 6 6" refX="6" refY="3" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L6 3 L0 6 Z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect width="1040" height="292" fill="#0d1117"/>
  <g fill="none" stroke="#8b949e" stroke-width="1.5" marker-end="url(#arrow)">
    <path d="M240 77 H338"/>
    <path d="M538 62 H800"/>
    <path d="M800 93 H538"/>
    <path d="M240 230 C292 230 286 108 338 108"/>
    <path d="M538 118 C586 194 668 230 800 230" marker-start="url(#arrow)"/>
  </g>
  <g fill="#161b22" stroke="#8b949e">
    <rect x="20" y="36" width="220" height="82"/>
    <rect x="338" y="36" width="200" height="82"/>
    <rect x="800" y="36" width="220" height="82"/>
    <rect x="20" y="189" width="220" height="82"/>
    <rect x="800" y="189" width="220" height="82"/>
  </g>
  <g fill="#e6edf3" font-family="Malgun Gothic, Apple SD Gothic Neo, Noto Sans KR, sans-serif" font-size="17" text-anchor="middle">
    <text x="130" y="67">XIAO ESP32S3 Sense</text>
    <text x="130" y="93">카메라 노드</text>
    <text x="438" y="67">Host PC 허브</text>
    <text x="438" y="93">검출 · 판단 · 관제 서버</text>
    <text x="910" y="67">MechDog ESP32</text>
    <text x="910" y="93">구동 노드 · 온보드 안전</text>
    <text x="130" y="220">LiDAR 중계 노드</text>
    <text x="130" y="246">ESP32 DevKit</text>
    <text x="910" y="237">관제 브라우저</text>
    <g font-size="15">
      <text x="289" y="63">MJPEG</text>
      <text x="669" y="51">UDP JSON 명령 10Hz</text>
      <text x="669" y="122">UDP JSON 텔레메트리 10Hz</text>
      <rect x="255" y="177" width="118" height="25" fill="#0d1117"/>
      <text x="314" y="195">UDP JSON 스캔</text>
      <text x="687" y="190">WebSocket</text>
    </g>
  </g>
</svg>

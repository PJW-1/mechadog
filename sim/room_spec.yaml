# 방 평면도 — 시뮬레이션 씬의 뼈대
#
# 좌표계: 방 한쪽 구석을 원점 (0,0), x=오른쪽, y=안쪽. 단위는 전부 미터.
# 지금은 줄자 실측으로 채우고, LD19 배선 후에는 tools/lidar_slam.py 의
# OccupancyGrid 에서 같은 형식으로 변환해 다시 만든다.
#
# ⚠️ 비어 있는 값은 실측 전 placeholder 다 — 씬을 만들기 전에 실측으로 채울 것.

room:
  name: lab_floor_1           # 측정한 실제 공간 이름
  measured_by: tape           # tape | lidar_occupancy
  measured_date: null

# 외곽 벽 — 닫힌 다각형 꼭지점 순서대로
walls:
  height_m: 2.4               # 천장까지 안 올려도 됨 — 카메라가 보는 범위만
  polygon: []                 # 예: [[0,0],[6.2,0],[6.2,4.8],[0,4.8]]

# 내부 장애물 — 기둥·책상·선반 등 바닥에 붙은 것
obstacles: []
#  - {name: desk_1, footprint: [[1.0,1.0],[2.2,1.0],[2.2,1.6],[1.0,1.6]], height_m: 0.75}

# 카메라 리그 — 실측값 (MODEL_PLAN 5.3)
camera:
  height_m: 0.15
  tilt_deg: -7                # 아래를 본다
  fov_h_deg: 32
  fov_v_deg: 24
  resolution: [640, 480]
  # 리그가 다닐 경로 — PPE 촬영 시점들
  waypoints: []               # 예: [[1.0,1.0],[3.0,1.0],[5.0,2.0]]

# 사람 배치 후보 지점 — Replicator 가 이 안에서 위치를 무작위화
person_zones: []
#  - {name: open_floor, polygon: [[0.5,0.5],[5.5,0.5],[5.5,4.0],[0.5,4.0]]}

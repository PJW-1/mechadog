[project]
name = "mechdog-physical-ai"
version = "0.3.0"
description = "MechDog Physical AI Security & Patrol Robot"
requires-python = ">=3.12"

[project.scripts]
mechadog-runtime = "host.runtime:main"

[tool.ruff]
line-length = 100
target-version = "py312"
# 마크다운은 포맷 대상에서 제외한다.
# ruff 0.16 부터 .md 안의 파이썬 코드 블록도 포맷 검사 대상이 되었는데,
# 문서의 예시 코드는 설명을 위해 일부러 압축하거나 안티패턴으로 쓴 것이라
# 포맷터가 강제할 대상이 아니다. 코드 품질 게이트는 실제 소스에만 건다.
exclude = ["third_party", ".venv", "build", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RET", "ARG", "PTH"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# host/ 를 import 가능하게 한다. 저장소 루트를 sys.path 에 넣는 표준 방법이며,
# 이것이 없으면 tests/ 에서 `from host.common import ...` 가 실패한다.
pythonpath = ["."]

[tool.mypy]
# 좁은 범위(host/common · host/behavior)부터 strict 로 켠다 — CI 는 `mypy host/common host/behavior`.
# 범위를 넓힐 때는 CI 명령에 패키지를 더하고 아래 follow_imports 예외에서 뺀다.
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

# 범위 밖 패키지는 타입 정보만 읽고 오류는 보고하지 않는다(아직 strict 를 통과하지 않는다).
[[tool.mypy.overrides]]
module = ["host.vision.*", "host.slam.*"]
follow_imports = "silent"

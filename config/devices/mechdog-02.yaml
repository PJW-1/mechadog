# 개체 프로파일 — mechdog-02 (WBS 2.4.1 부분)
#
# ⚠️ **`mechdog-02` 라는 번호는 잠정이다.** 기체 번호는 `2.4.1` 에서 확정하며
# (`ref.yaml.example` 참조) 그때 바뀔 수 있다. **실제 신원은 아래 MAC 이다** —
# 번호가 바뀌어도 `telemetry_device_id` 는 그 보드 하나만 가리킨다.
#
# ⚠️ **이 기체는 `mechdog-01` 과 같은 모델이지만 다른 물체다.** 두 기체의 값을
# 서로 복사하지 않는다 — 서보 오프셋 비대칭이 개체마다 다르고, 그 차이가 곧
# 속도·선회율·직진 편향의 차이로 나온다(CONTRIBUTING 6절). 실제로 **직진
# 편향의 방향부터 반대다** — `mechdog-01` 은 좌, 이 기체는 우다(아래 참조).
# 복사했으면 보정이 편향을 두 배로 키웠을 자리다.

device_id: mechdog-02
owner_id: unassigned # `2.4.1` 에서 실제 담당자로 채운다

# 부팅 UART 의 `Telemetry identity:` 줄에서 읽었다. 2026-09-11·09-13 측정 로그에
# 같은 값이 찍혀 있다. 보드(ESP32)를 바꾸면 이 값도 바뀐다.
telemetry_device_id: mechdog-3c8a1f1d80cc

reference_role: none

network:
  # 실측 전이다. **틀린 주소가 적혀 있는 것이 비어 있는 것보다 나쁘다** —
  # `2.4.2` 에서 확정한다.
  mechdog_ip: null
  xiao_ip: null
  cmd_port: 5001
  telemetry_port: 5101

# ⚠️ **아직 재지 않았다 — 0 이 아니라 `null` 이다.**
#
# 0 아홉 개는 *"보정이 필요 없다"* 는 뜻이 되어 버리고, 이 값은 유실 대비
# 보관본이므로(호스트는 읽기만 하고 로봇에 보내지 않는다) 틀린 기록이 그대로
# 남는다. 없는 것과 0 인 것은 다르다.
#
# `mechdog-01` 의 `[0, -36, -82, -14, -97, 3, 100, 36, 62]` 를 복사하지 않는다.
# 그 값은 그 개체의 서보 편차이며 이 기체에 넣으면 더 비뚤어진다.
servo_offset: null

gait_calibration:
  # 2026-09-21/22 실측 — 실내 장판 검정 테이프 구역, 3초 창 ×3회.
  # 전진은 두 세션에서 갈렸다: 09-21 73.8(220/215/237mm) 대 09-22 68.7
  # (215/210/193mm). 최신 세션 값을 적고, 세션 간 7% 차이는 배터리·발 미끄럼
  # 수준의 변동으로 본다.
  forward_mm_per_sec: 68.7
  # ⚠️ **후진이 전진보다 빠르다 (83.8 vs 68.7, +22%).** "후진 = 전진" 가정은
  # 이 기체에서도 성립하지 않는다 — 회피 후진 시간을 전진 속도로 계산하면
  # 목표보다 더 물러난다.
  reverse_mm_per_sec: 83.8
  # 좌선회 외부 나침반 실측 4회 평균 (14.0/7.0/9.4/10.0 도/s). 회피는
  # +turn_angle_deg(좌선회)만 쓴다. ⚠️ 3초 창 값이다 — mechdog-01 에서 선회율은
  # 창이 길수록 커졌으므로(5.2초→6.8, 12초→7.7) 이 값은 보수적일 수 있다.
  # 우선회 대조: -10.0 도/s (n=3, -28/-32/-30도) — 좌우 대칭에 가깝다.
  turn_deg_per_sec: 10.1
  # 후진+좌선회 `move(-60,+20)` 실측 — 회피 시퀀스가 쓰는 방향(ADR-29).
  # ⚠️ **분산이 크다** — 3회가 1.1/9.3/14.7 도/s (2회차는 발 미끄럼으로 거의
  # 무동작). 평균 8.4 를 쓰되 실제 회피 각도는 이보다 적게 돌 수 있다.
  reverse_turn_deg_per_sec: 8.4
  # 후진 선회 중 후퇴: 3회 현 길이 합 398mm / 9.1s = 43.7 mm/s.
  reverse_turn_mm_per_sec: 43.7
  measured_on: "2026-09-22"

  # ⚠️ **직진이 오른쪽으로 휜다 — `mechdog-01` 과 방향이 반대다.**
  #
  # 조종자가 영상을 찍은 계기가 *"직진할 때 오른쪽으로 휘는 느낌"* 이었고,
  # 2026-09-11 폰 자이로도 직진 4개 구간이 전부 우, 후진 4개 구간도 전부 우였다.
  # `mechdog-01` 은 좌 1.0 도/s 다. **같은 모델이어도 편향 방향이 갈린다** —
  # WBS 2.2.3 이 *"이 비대칭은 기체마다 방향도 크기도 다르게 나온다"* 고 적어 둔
  # 그대로다.
  #
  # 2026-09-22 실측 — 발 기준선 이탈로 산출한 3회 외부값 -11.8/-2.7/-10.6도
  # ÷ 3초 창 → 평균 -2.8 도/s 우편향(음수=우측). 09-11 폰 자이로(-1.5~-4.8도)
  # 와 방향 일치. 눈대중 추정(-2~-4도)보다 큰 편향이 확인됐다.
  forward_yaw_drift_deg_per_sec: -2.8
  # ⚠️ **straight_bias_deg 는 여전히 비워 둔다.** 편향을 상쇄하는 angle 바이어스를
  # 찾으려면 `--bias-deg` 스윕으로 "방향 변화 0 이 되는 각도"를 재야 한다 —
  # 편향 크기(-2.8 도/s)가 아니라 명령 각도(deg)가 들어가는 키다. 데드밴드가
  # 있을 수 있어 실측 없이 선형 외삽하지 않는다.
  straight_bias_deg: null

  # ⚠️ **출발할 때마다 코가 오른쪽으로 채인다 (2026-09-11).** 직진 구간 4개 중
  # 둘에서 첫 0.5초에 -6.3 도/s 가 나오고 그 뒤에는 거의 0 이었다 — 회당 약
  # 2~3도의 **출발 킥**이며 지속 편향과 다른 현상이다. 10초 창으로 재면 희석돼
  # 보이지 않는다. **순찰이 서다 가다를 반복하면 출발마다 쌓인다.**
  # 확정하려면 출발만 반복해 재야 한다.

  # 트롯 보행 중 몸체 자세 진폭 (WBS 2.2.3 ②). 스트라이드 한 주기 안의
  # **반진폭** `(max - min) / 2` 다 — 피크투피크는 2배다.
  #
  # 2026-09-11 폰(phyphox) 자이로 99.4Hz 측정을 2026-09-13 에 정리했다.
  # 직진·후진·좌회전·우회전 179 사이클이며, 활동 구간은 `05_실물_측정결과/
  # 2026-09-11/` 의 기존 구간 분석을 그대로 썼다(재분할 없음). 전체 보고서와
  # 재현 스크립트가 거기 있다.
  #
  # ⚠️ **폰이지 온보드 IMU 가 아니다.** 폰을 등에 벨크로로 강결합했으므로 몸체
  # 진폭은 같게 나오지만, `4.1.4` 텔레메트리가 오면 장착 위치·강성 차이만큼
  # 달라질 수 있다. 그때 같은 형식으로 다시 재고 이 값을 대체한다.
  #
  # ⚠️ **롤이 피치보다 크다** — p95 에서 1.4배다. 트롯은 대각 두 다리가 함께
  # 나가므로 좌우로 기우는 쪽이 더 흔들린다. **마스트는 롤을 기준으로 본다.**
  #
  # ⚠️ **`FR-6.2.2` 보행 중 측위가 이 값에 걸려 있었다**(`OI-24`). 스캔면이
  # 스트라이드당 p95 +-2.6도, 최악 +-4.2도 기울므로 마스트 높이 h 에서 바닥
  # 교점이 `h x tan(4.2도) ~= 0.073h` 만큼 움직인다 — 마스트 20cm 면 약 1.5cm 다.
  # **이 기체 기준이며 `mechdog-01` 에 그대로 적용하지 않는다.**
  posture_amplitude:
    # 스트라이드 주파수. 네 파일 스펙트럼 피크가 2.75~2.80Hz 로 모였다.
    # ⚠️ **명령보다 20% 느리다** — 전역 설정의 `lift 120ms + ground 180ms
    # = 300ms` 는 3.33Hz 인데 실제는 2.77Hz(361ms)다. 서보가 명령 주기를
    # 못 따라간다. 5.55Hz 피크는 2배 고조파다(트롯에서 대각 두 쌍이 한
    # 스트라이드에 각각 밟는다).
    stride_hz: 2.77
    pitch_p95_deg: 1.84
    pitch_max_deg: 2.67
    roll_p95_deg: 2.62
    roll_max_deg: 4.19
    cycles: 179
    # 폰 기준임을 값 옆에 남긴다 — 주석은 복사 중에 떨어져 나가지만 키는 남는다.
    source: phone_imu
    measured_on: "2026-09-11"

  measured_on: "2026-09-11"

measured:
  body_weight_g: null # H3 은 합·불만 보므로 무게를 재지 않는다
  payload_pass_g: null
  runtime_min: null
  wifi_rssi_dbm: null

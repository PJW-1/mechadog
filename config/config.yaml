# ══════════════════════════════════════════════════════════════
#  MechDog Physical AI — 전역 파라미터
#  NFR-3① : 하드코딩된 매직 넘버 0개를 목표로 한다.
#           코드에 숫자를 박지 말고 여기에 추가할 것.
#  개체별 값은 config/devices/<unit-id>.yaml 에서 병합된다.
# ══════════════════════════════════════════════════════════════

profile: dev            # dev | prod

network:
  # 개체별 IP/포트는 devices/*.yaml 에서 덮어쓴다 (WBS 2.4.2)
  cmd_port: 5001        # Host PC → MechDog (UDP)
  telemetry_port: 5101  # MechDog → Host PC (UDP)
  # ⚠️ 스트림 URL 을 여기 적지 않는다. **개체 프로파일의 `xiao_ip` 에서 조립한다.**
  # 고정 주소를 적어 두면 실제 공유기에서 달라지고, **틀린 주소가 적혀 있는 것이
  # 비어 있는 것보다 나쁘다** — `mechdog_ip` 를 `null` 로 둔 것과 같은 이유다.
  vision_control_port: 80   # 상태·프로파일 (XIAO 펌웨어)
  vision_stream_port: 81    # MJPEG. 스트림이 오래 점유하므로 제어 포트와 분리한다
  cmd_rate_hz: 10       # FR-5.1 — 변화 없어도 고정 송신
  telemetry_rate_hz: 10 # FR-1.4

safety:                 # ⚠️ Tier 1 — 온보드에서만 판정 (아키텍처 1.2 불변 규칙)
  cmd_timeout_ms: 600         # FR-1.3
  link_loss_failsafe_ms: 3000 # FR-1.5
  obstacle_stop_cm: 25        # FR-2.2
  battery_warn_v: 7.0         # NFR-2.3
  battery_shutdown_v: 6.6     # NFR-2.3
  # ⚠️ **전도 감지(NFR-2.4)는 폐기됐다 (2026-09-20 · ADR-36). 이연이 아니다.**
  # 같은 날 실측에서 **`FAILSAFE` 로 정지한 로봇의 IMU 1초 평균 피치가 2.47~83.01°를
  # 배회**해 임계 60°를 혼자 넘었다. `POSE` 0→-30 스윕에서는 카메라가 22.7° 움직이는
  # 동안 IMU 피치가 2.3° 만 변했다(축 매핑 불일치). **정지 중 83°가 나오는 센서로는
  # 어떤 임계로도 의도된 자세와 전도를 가를 수 없다** — NFR-2.4.1 이 기대한 «빈 구간»
  # 자체가 없다. 2차 손상 방지는 `A-13`(상시 인적 감시) 아래 사람의 `ESTOP` 이 맡는다.
  #
  # ⚠️ **그런데 두 값은 남긴다 — 전도 감지를 위해서가 아니다.**
  # `tools/mock_mechdog.py` 와 시험 다섯 곳이 이 값으로 **«로봇이 `ONBOARD_FAILSAFE` 를
  # 보고했을 때 호스트가 어떻게 처리하는가»** 를 검증한다. 그 경로는 링크두절·저전압으로
  # 살아 있어야 한다. **지우면 시험 다섯 파일을 건드리고 얻는 것이 없다.**
  # 즉 아래 60°는 «전도 임계» 가 아니라 **«목업이 만드는 넘어진 자세의 눈금»** 이다.
  tip_angle_deg: 60
  tip_duration_ms: 2000       # NFR-2.4

gait:                   # HW_MechDog API 파라미터 (DR-1)
  # ⚠️ **보폭이 아니라 전진 속도 지령이다.** 벤더 서명이 `move(speed_x, angle_rate)` 이며
  # `60` 의 실측 결과가 104 mm/s 다(`mechdog-01` · 2026-09-11). 이름의 `mm` 는 오해를 부른다.
  step_length_mm: 60          # -100 ~ 100
  # -30 ~ 30 (arc 조향. 제자리 회전 불가 — DR-11)
  # ⚠️ **양수는 반시계 = 로봇의 좌회전**이다 (PROTOCOL 부호 규약). 회피 시퀀스가
  # 이 값을 그대로 쓰므로 **회피는 좌회전한다** — `turn_deg_per_sec` 에 들어갈
  # 값도 그래서 좌선회 실측값이다.
  turn_angle_deg: 20
  # ⏸ **아래 셋은 지금 로봇에 도달하지 않는다 (2026-09-15 확인).** 벤더의
  # `set_gait_params` 가 `quad_kinematics` 에 있고 `MechDog` 클래스가 노출하지 않아
  # `GAIT` 명령이 적용될 곳이 없다. 벤더는 초기화 때 `(150, 200, 25)` 를 한 번 부르고
  # 끝이므로 **로봇은 항상 그 값으로 걷는다** — 아래 값은 그때 쓸 자리를 지켜둔 것이다.
  # ⚠️ 지우지 않는 이유: 벤더가 노출하면 되살릴 값이고, 지금 지우면 "설정이 정본" 규칙
  # (NFR-3①)에서 이 항목만 사라진다. 실질 영향은 **발 드는 높이 25mm 고정** 하나이며
  # Phase 1 실내 평지 시연에서는 걸리지 않는다. 상세는 PROTOCOL.md 의 `GAIT` 각주.
  lift_time_ms: 120
  ground_time_ms: 180
  lift_height_mm: 25
  reverse_distance_mm: 200    # FR-2.3 — 제자리 회전 불가로 후진 거리 확보

# ── 내장 액션 (FR-1.2 · WBS 4.1.2) ────────────────────────────
# 벤더 `action_run(이름)` 에 넘길 이름표. **숫자가 아니라 이름을 적는다** — 벤더는
# 숫자 ID 를 갖고 있지 않고 `aclist[]` 를 이름으로 훑는다. 순서만 적어 두면 벤더가
# 목록을 바꿨을 때 조용히 다른 동작이 나간다.
#
# ⚠️ **모르는 이름은 아무 일도 하지 않는다.** `act_run_func` 가 두 목록을 훑고 못
# 찾으면 오류 없이 끝난다 — 오타 하나가 "조용한 무동작" 이 된다. 그래서 펌웨어가
# 기동 때 이름이 실재하는지 확인하고 로그에 남긴다.
#
# ⚠️ **단일 구간 액션만 싣는다.** `action_run` 은 구간마다 `delay()` 로 블로킹하므로
# 그동안 `loop()` 가 통째로 멈춘다 — UDP 수신도 300ms 명령 타임아웃 검사도 함께
# 멈춘다(NFR-1 비목표: 온보드 블로킹 금지). 1,000ms 단일 구간은 정지 상태에서만
# 받으므로 감당되지만 `nodding_motion`(5구간 1,700ms) 같은 것은 싣지 않는다.
# 그리고 **펌웨어가 보행 중에는 거절한다** — 걷다가 멈추면 타임아웃이 자기 자신
# 때문에 걸린다.
actions:
  id_map:
    0: stand_four_legs   # 기본 자세 복귀 (FR-9.2.3 `posture.return_before_move`)
    1: sit_dowm          # 앉기 — `posture.escalation_steps` 의 `sit`.
                         # ⚠️ 벤더 오타 그대로다. 고쳐 적으면 못 찾는다
    2: go_prone          # 엎드림 — `FAILSAFE` 안정 자세 (아키텍처 3.1 `F` 행)

# ══════════════════════════════════════════════════════════════
#  운용 모드 (FR-11 · ADR-33 · WBS 3.4.4)
#  순찰 하나는 모드 하나로 돈다. 표는 `host/behavior/mission.py` 가 정본이며
#  여기서는 **어느 모드로 기동할지**만 고른다.
# ══════════════════════════════════════════════════════════════
mission:
  # guard(경비) | factory(공장)
  #
  # ⚠️ **모르는 값은 기동을 거부한다.** 기본값으로 떨어지면 오타 하나가
  # *"경비 모드로 잘 도는 것처럼 보이는 공장 순찰"* 이 된다 (FR-11.2).
  #
  # ⚠️ **`safety` 가 아니다.** 첫 이름은 «안전점검»이었고 보호구만 가리켜 범위를
  # 좁게 만들었다 — 2026-09-17 ADR-33 개정이 쓰러진 사람·무너진 물건까지 포함하는
  # «공장»(`factory`)으로 넓혔다.
  #
  # ⚠️ **`factory` 는 선행 구현이 없으면 켜지지 않는다** (FR-11.7).
  # `factory` 는 PPE 판정기(`3.7.3`)가 저장소에 들어와야 고를 수 있다. 판정기 없이 켜면
  # 로봇이 사람 앞에 서서 아무 판정도 내지 못한다.
  mode: guard
  # 기동 인자 `--mode` 가 이 값을 덮어쓰고, 관제 화면은 `IDLE`·`MANUAL` 에서만
  # 바꿀 수 있다 (FR-11.3). 전환은 L3·F 를 풀지 않는다 (FR-11.4).

fsm:
  patrol_scan_interval_s: 10  # FR-2.4
  scan_duration_s: 3
  # ⚠️ **부호 주의 — 양수 pitch 는 앞이 «내려간다».** 2026-09-15 실기로 확정했다
  # (`POSE pitch=+15` → IMU pitch 1.0 → 17.4 이며 눈으로도 앞이 내려갔다.
  # `-15` 는 -11.6 으로 앞이 올라갔다). ROS REP-103 과 같은 규약이다.
  # **그래서 «고개를 드는» 경계 자세는 음수다.** 예전 값 `+15` 는 이름만 «Pitch Up»
  # 이고 실제로는 바닥을 보게 만들었다 — `angle` 부호와 같은 실수였고, 다행히 아직
  # 아무도 읽지 않아(`3.5.2`·`3.5.3`·`3.5.7` 미착수) 코드에 들어가기 전에 잡았다.
  scan_pitch_deg: -15         # 스캔은 위를 훑는다. yaw는 불가 — DR-11
  alert_pitch_deg: -15        # FR-3.3 — 경계 자세는 «고개를 든다» = 음수
  target_lost_timeout_s: 5    # FR-3.7
  track_deadzone_px: 40       # FR-3.5 — 이 안에서는 조향하지 않고 거리만 맞춘다
  # 마지막 추종 지시를 몇 ms 까지 계속 내보낼지. 넘으면 정지를 보낸다.
  #
  # ⚠️ **`safety.cmd_timeout_ms` 를 빌려 쓰고 있었다 — 다른 관심사다.** 그쪽은
  # *"링크가 살아 있는가"* 이고 이쪽은 *"관측이 신선한가"* 인데 우연히 한 숫자(300ms)를
  # 공유했다. 그래서 검출이 0.3초만 끊겨도 정지가 나가 **가다말다**가 됐다 —
  # 2026-09-18 실기에서 `TRACK` 구간의 초당 추종 지시가 중앙값 1/25 까지 떨어졌다
  # (카메라가 바닥을 보던 첫 런). 4족 보행의 흔들림은 물리라 공백을 0 으로 만들 수 없다.
  #
  # 1초로 잡은 근거 — 알려진 유일한 공백 분포의 **중앙값이 956ms** 다(첫 실기 · 38회).
  # 그 바로 위라 짧은 공백은 덮고 긴 공백은 덮지 않는다. 상한이 하는 일이 그것이다:
  # 8초짜리 공백은 1초만 이어 가고 나머지는 정지이며, 5초 뒤 `TARGET_LOST` 가 순찰로
  # 돌려보낸다.
  #
  # ⚠️ **회전도 함께 이어 간다.** 대상이 화면 밖으로 빠지면 그쪽으로 조금 더 돌아야
  # 쫓을 수 있고(제자리 회전이 불가하므로 호로만 가능 · DR-11), 조향을 버리면 로봇은
  # 직진만 한다. 위험은 상한이 막는다 — 1초는 **6.8도 · 10.4cm** 이며 전진은 온보드
  # 25cm 반사 정지가 따로 막는다. `target_lost_timeout_s`(5초)의 1/5 이라 상실
  # 타이머와도 부딪히지 않는다.
  #
  # ⚠️ **이 값도 한 번의 실측에서 나왔다.** `track_gap_ms` 를 1초 요약에 실었으니
  # 다음 실기에서 공백 분포가 찍힌다. 그때 맞는지 틀린지 숫자로 판정한다.
  track_coast_ms: 1000
  # ── FR-3.5.2 거리 유지 ──────────────────────────────────────
  # 목표 `person` bbox 높이(px). **미터로 바꾸지 않는다** — 화면 높이를 목표값
  # 근처로 유지하는 비주얼 서보잉이다 (DR-15).
  #
  # ⚠️ **이 기체에서 bbox 높이는 «크기» 가 아니라 «머리 위치» 다 (2026-09-20 실측).**
  # 카메라가 15cm 높이라 0.7~2.0m 전 구간에서 **발이 화면 밖**이며(bbox 아래끝이
  # 프레임 바닥에 박힌 프레임 97~100%), 그래서 높이는 사실상 `480 - y1` 이다 —
  # 실측 오차 몇 px 로 일치한다(0.70m 460.3 대 462.5 · 1.00m 391.8 대 394.7 ·
  # 2.00m 275.5 대 276.3). **거리에 반비례하지 않는다** (`h × 거리` 가 322 → 551 로
  # 계속 커진다). 단조롭기는 하므로 제어에는 쓸 수 있으나 **상한 480px 이 있다.**
  #
  # ⚠️ **그래서 `목표 × track_stop_ratio` 가 480 을 넘으면 로봇은 영원히 안 선다.**
  # 실제로 그랬다 — 「1.0m 에서 읽어 채운다」 를 따르면 392 가 나오고 392×1.25 = 490
  # 이라 **VGA 프레임에서 나올 수 없는 값**이다. 머리가 다 잘려도 ratio 는 1.22 에서
  # 멈추고 보폭은 최소(15mm)로 기어와 초음파 25cm 까지 간다. 2026-09-19 에 운용자가
  # 본 「코앞까지 온다」 가 이것이며, **목표값을 채워도 재현된다.**
  #
  # 그래서 **1.0m 이 아니라 1.5m 에서 읽는다** — 감속 구간을 벌기 위해서다. 392 에
  # 비율 1.11 을 써도 정지 위치는 같지만 감속이 15cm 안에서 끝나 급정거가 된다.
  # 재는 법: `tools/vision_link_check.py` 로 줄자 거리에 15초 서서 `person` bbox
  # 높이 중앙값을 읽는다(원자료 `TEST_MECHDOG/results/20260920_3.5.7-3.5.8/`).
  #
  # ⚠️ **개체·사람 키에 묶인 값이다.** 키가 크면 더 멀리, 작으면 더 가까이 선다.
  # 지키는 것은 「1.0m」 가 아니라 **「머리가 화각에 남는다」** 이며 그 거리는 사람마다
  # 다르다 — 깊이 센서가 없는 대가다(DR-15). 다른 기체에 복사하지 않는다.
  track_target_height_px: 310
  # 목표 높이의 몇 배가 되면 완전히 세우는가. 넘으면 `step=0` 이다.
  #
  # ⚠️ **위 상한(480px) 아래에 놓아야 한다.** 310 × 1.41 = 437px 이고 이는 `y1`=43,
  # 즉 **머리 위 43px 이 남은 자리**다 — 2026-09-20 실측에서 클리핑 0% 였던 마지막
  # 거리(0.85m)다. 0.70m 은 프레임의 15% 가 이미 머리 잘림이었다.
  # 감속은 1.5m(ratio 1.0)부터 0.85m 까지 65cm 에 걸쳐 60 → 0mm 로 편다.
  track_stop_ratio: 1.41
  # 박스가 437px 에 못 닿는 사람(웅크림·앉음)도 세운다. 둘 중 먼저 닿는 쪽이 정지선이다
  # (ADR-40). 온보드 반사 정지(25cm)보다 앞에 둔다 — 그쪽은 추종을 끊는 안전 정지다.
  track_stop_dist_cm: 40
  # ── 제자리 회전 (ADR-40 · 2026-09-23 실측) ─────────────────────
  # 정지선에서는 걷지 않고 제자리에서 돌아 중앙을 맞춘 뒤 고개를 든다. 정지선 전이라도
  # 편차가 `split` 을 넘으면 먼저 제자리에서 돈다 — 호로 돌면 다가가며 편차가 벌어진다.
  #
  # ⚠️ **각은 두 단계뿐이다.** mechdog-01 은 좌회전이 15° 이하에서 **아예 돌지 않고**
  # 20° 부터 돈다(우회전은 5° 도 돈다). 속도는 4~7°/s 로 각에 거의 비례하지 않으며
  # 멈춘 뒤 미끄러짐은 ±2.5° 안이다 — 원자료 `TEST_MECHDOG/results/20260923_small-angle-rotation/`.
  track_turn_split_px: 120
  track_turn_small_deg: 20
  track_turn_large_deg: 30
  # 정지선에 닿은 뒤 이 시간 안에 중앙을 못 맞추면 **그대로 고개를 든다** (ADR-40).
  # 대상이 분기점을 계속 넘나들면 `ALERT` 에 들 때마다 자세 대기가 다시 시작돼 L1 에
  # 영영 닿지 않는다. 정상 조준은 실기 최장 5.05초(30°·20° 두 번)라 그 위에 둔다.
  track_aim_timeout_ms: 8000
  # ⚠️ **0 으로 두면 안 된다 — 전진이 없으면 조향도 죽는다.** 제자리 선회가
  # 불가하므로(DR-11) 호로만 돌고, 호는 전진이 있어야 생긴다. 목표 거리에
  # 닿았는데 아직 정렬이 안 됐으면 **이 보폭으로 계속 돈다** (2026-09-19 결정).
  # ⚠️ 2026-09-23 부터 정지선에서는 제자리 회전으로 바뀌었다 (ADR-40 · 위 `track_turn_*`).
  track_min_step_mm: 15
  # FR-2.3 — 회피 시퀀스(후진→선회→재확인)를 최대 몇 번 되풀이할지.
  # 다 쓰고도 못 빠져나오면 멈춘 채로 둔다 — 계속 흔들면 기어만 상하고,
  # 갇힌 상황은 사람이 봐야 한다. 자동 복구를 만들지 않는 것과 같은 원칙이다.
  avoid_attempts: 3

vision:
  # ── 실행 프로바이더 ── Windows GPU 우선, CI·비지원 환경은 CPU 폴백 (DR-13)
  providers: [DmlExecutionProvider, CPUExecutionProvider]

  # ── 스트림 ──
  # 카메라가 초당 몇 장을 보낼지. ⚠️ **상한을 두는 목적은 낮추는 것이 아니라
  # 예측 가능하게 만드는 것이다.** 상한이 없으면 JPEG 크기가 화면 내용에 따라
  # 변하고 발열에 따라 fps 가 흘러서, 명령 타임아웃(300ms) 대비 최악 부하를
  # 계산할 수 없다. 호스트가 기동 시 이 값을 XIAO 에 내려보낸다.
  # 15fps 는 NFR-1.3 최소값이고 25fps 는 지연(프레임 주기 40ms)과 airtime 의
  # 절충점이다 — 30fps 로 올려도 7ms 만 더 얻는다.
  stream_fps_limit: 25

  # 모듈을 광축 기준으로 180도 돌려 단 경우의 보정 (0 | 180).
  #
  # ⚠️ **펌웨어에만 두면 재부팅마다 풀린다.** `/orient` 로 바꾼 값은 XIAO 의 평범한
  # 전역 변수라 전원을 껐다 켜면 사라진다. 그래서 `resolution`·`stream_fps_limit`
  # 과 같은 규칙을 적용한다 — **설정이 정본이고 호스트가 기동 때 내려보낸다**(NFR-3①).
  # 펌웨어 기본값은 폴백이다.
  mount_rotation: 0

  # 이 시간 동안 프레임이 없으면 **비전 단절**로 본다 (NFR-2.6).
  # ⚠️ `safety.link_loss_failsafe_ms` 와 의도적으로 다른 절에 둔다 —
  # 로봇 링크 두절은 **안전 문제**라 페일세이프로 가지만, 비전 단절은
  # **기능 저하**라 순찰·회피를 계속하고 사람 인지만 끈다. 둘을 같은 절에
  # 두면 언젠가 같은 대응으로 묶이고, 그러면 카메라가 딸꾹질할 때마다
  # 로봇이 멈춘다.
  stall_timeout_ms: 2000

  # ── ① COCO 범용 검출기 (학습 불요, DR-12) ──
  # FR-3 사람 인지 + FR-8 변화 감지 대상 객체를 담당
  coco:
    model_path: "models/coco.onnx"
    # 확정 (2026-09-10, OI-15 닫힘 · ADR-24) — YOLOX-S, Apache-2.0 / Megvii Inc.
    # 이 값으로 `host/vision/detector.py` 의 어댑터가 결정된다. 모르는 이름은 거부된다.
    # ⚠️ 가중치를 바꾸면 이 값과 `coco_labels.py` 의 순서를 함께 확인한다.
    model_family: yolox
    input_size: 640           # YOLOX 격자(stride 8/16/32)의 배수여야 한다
    conf_threshold: 0.5        # FR-3.2
    iou_threshold: 0.45
    person_class: person
    # FR-8 변화 감지에서 추적할 클래스 (시연 환경에 놓일 소품)
    change_watch_classes: [chair, backpack, handbag, bottle, suitcase, laptop, book]

  # ── ② PPE 전용 모델 (직접 학습, 5클래스) ──
  # person 검출 프레임에서만 실행 (FR-3.1.1 게이팅)
  ppe:
    model_path: "models/ppe.onnx"
    # ⚠️ **`ultralytics` 가 아니다.** AGPL-3.0 이라 ADR-24 가 탈락시켰다.
    # WBS 3.7.2 의 "ultralytics 버전 기록" 문구는 그 결정 이전의 잔재다.
    #
    # 학습 기록 (FR-9.1.2 재현성) — 2026-09-23 (v3)
    #   계열     YOLOX-Nano (Apache-2.0 · Megvii) · depthwise · 640x640
    #   출발점   yolox_nano.pth (릴리스 0.1.1rc0) 에서 fine-tune
    #   데이터   ppe_coco_v3 — 4원 병합 5,914장 / 박스 40,591개
    #            · 시뮬 3세션 570장 — XIAO 기하(높이 0.15m·+15°·FOV 74x59)
    #              sim_factory_t15 150 + 쓰러짐 세션 sim_fallen_t15(b) 420
    #              (v2의 person_down 라벨 0개 결함은 자세 순환 강제로 해소)
    #            · Construction-PPE 1,416장 — 주황 헬멧·형광 조끼 실사
    #            · SHWD 7,581장 중 샘플링 — hat→helmet · person→no_helmet
    #            · Simuletic laying 112장 — laying→person_down (CC BY 4.0)
    #            (학습 5,914 · 검증 514 — person_down 211/17개)
    #   설정     100 epoch · batch 16 · fp16 · mosaic 마지막 15ep OFF
    #            HSV 채도 게인 30→15 (주황·형광이 판정 단서라 약하게 — MODEL_PLAN 1.3)
    #   산출물   models/ppe.onnx · 3,677,797 bytes · Release 태그 ppe-v3
    #            sha256 a294c1b7d887fe9a80888adf5335602c741727c4963578beea183fc2876e8ed4
    #   ⚠️ 출력은 **디코드 전 원시 [1, 8400, 10]** 다 (4클래스→5클래스로 +1).
    #      어댑터가 격자 디코드를 한다 — 디코드된 모델을 넣으면 좌표가 두 번
    #      변환돼 박스가 엉뚱한 곳에 찍힌다.
    #
    # ⚠️ 아래 수치는 **병합 검증셋 460장** 기준이며 확정값이 아니다.
    #    FR-9 판정은 XIAO 실기 프레임으로 한다 (OI-13).
    #      mAP(0.5:0.95) 0.5080 · 클래스별 AP — helmet 0.666 · vest 0.542
    #      no_vest 0.495 · no_helmet 0.398 · person_down 0.439 (AR 0.529)
    #      ⚠️ no_helmet·person_down 은 실사 표본 부족으로 미흡 — 실기 보강 대상
    model_family: yolox
    input_size: 640
    conf_threshold: 0.5
    classes: [helmet, no_helmet, vest, no_vest, person_down]
    violation_classes: [no_helmet, no_vest]
    crop_pad: 0.08             # person bbox 크롭 여유 (XIAO 실측으로 조정)
    # ── 위반 확정 (FR-9.4) ──
    # ⚠️ **프레임 수가 아니라 시간 창이다** (ADR-25). 프레임으로 두면 의미가 추론률에
    # 종속되어 같은 3히트가 10fps 에서 0.3초, 25fps 에서 0.12초가 된다.
    #
    # ⚠️ `person` 게이트의 300ms 를 그대로 쓰지 않는다. PPE 는 사람이 멈춰 선 뒤
    # 판정하므로 창이 더 길어도 되고, 짧으면 단발 오검출 한 장이 L3 를 부른다.
    # L3 는 관리자 확인으로만 풀린다.
    violation_window_ms: 1500
    violation_hits_required: 3
    # ── 판정 조건 (FR-9.2.1) ──
    # ⚠️ 미터 거리를 쓰지 않는다 (DR-15). 거리를 측정할 수단이 없다 —
    # 깊이 모델과 초음파를 모두 배제했고, 초음파는 정면 근거리만 본다.
    # 요구사항의 실체는 "머리가 화각에 들어오는가"이므로 bbox 로 직접 판정한다.
    require_head_visible: true  # person bbox 상단이 프레임 경계에 닿지 않을 때만 판정
    head_margin_px: 8           # 상단 경계로부터 이 픽셀 이내면 클리핑으로 본다
    # ── 대상 정지 조건 (FR-9.2.0) ──
    # 이동하는 대상은 추종이 불가능하다. 로봇 10~30cm/s vs 사람 120~150cm/s.
    # 게다가 상향 자세에서는 이동할 수 없어(FR-9.2.3) 루프에 빠진다.
    require_target_static: true # 대상이 정지 상태일 때만 자세 상승 시퀀스 개시
    static_threshold_px: 20     # bbox 중심 이동량이 이 값 이하면 정지로 본다
    static_frames: 5            # 위 조건이 이 프레임 수만큼 지속되어야 한다
    max_posture_retries: 2      # FR-9.2.4 — 초과 시 PPE_UNDETERMINED 기록 후 순찰 재개
    # 자세 상승은 판정의 전제가 아니라 클리핑 시의 대응 수단이다 (FR-9.2.2).
    # 단계 정의는 posture.escalation_steps 를 따른다.

  # ── 쓰러짐 규칙 판정 (FR-9 · 4.8.3 · ADR-35 대안 ⓓ) ──
  # VLM 과 **함께** 둔다. 즉시·무료·설명 가능하며, 가장 급한 사건을 0.4초짜리 모델
  # 하나에만 맡길 이유가 없다. VLM 은 구역당 한 번이지만 이쪽은 추론마다 돈다.
  fallen:
    # 가로 ÷ 세로가 이 값 이상이면 «누움» 후보다.
    #
    # 실측 — 쓰러진 작업자의 박스는 세로 88 · 가로 286 으로 **3.25** 였다. 서 있는
    # 사람은 0.4 안팎이고 앉은 사람도 1.0 을 크게 넘지 않는다. 1.5 는 그 사이이며
    # 앉은 자세를 넉넉히 비켜 간다.
    aspect_ratio: 1.5
    # bbox 중심 이동량이 이 값 이하면 정지로 본다.
    still_threshold_px: 20
    # 위 둘이 이만큼 이어져야 확정한다.
    #
    # ⚠️ **`vision.ppe.static_frames`(5프레임 ≈ 0.2초)를 빌려 쓰지 않는다.** 저쪽은
    # *"자세를 올려도 되나"* 라 곧 움직일 사람만 거르면 되지만, 이쪽은 *"위험한가"* 이고
    # **넘어진 직후 버둥거리는 것과 의식을 잃은 것**을 갈라야 한다. 3초는 그 경계다.
    #
    # ⚠️ **프레임이 아니라 시간이다** (ADR-25). 프레임 수로 두면 같은 조건이 10fps 와
    # 25fps 에서 2.5배 다른 시간이 된다.
    confirm_ms: 3000

  # ── ③ 로컬 VLM 상황 판독 (FR-8 · 4.8.0 · ADR-35) ──
  # 객체 목록 비교로는 «넘어진 소화기» 를 말할 수 없다 — COCO 80 에 그 물건이
  # 아예 없기 때문이다. 그래서 사진을 그대로 읽는 경로를 하나 둔다.
  #
  # ⚠️ **가중치 경로가 여기 없다.** Hugging Face 캐시에서 직접 읽으며 `models/` 에
  # 두지 않는다 — 샤드·인덱스·토크나이저가 한 벌로 움직인다(`models/README.md` ③).
  #
  # ⚠️ **없어도 멈추지 않는다.** 검출기는 가중치가 없으면 `ModelMissingError` 로
  # 즉시 서지만 이쪽은 Tier 3 이라 기록만 남기고 지나간다 (ADR-35 결정 6).
  vlm:
    # Hugging Face 모델 ID. **가중치 경로가 아니다** — 캐시에서 ID 로 읽는다.
    # ⚠️ 정밀도는 코드가 bf16 으로 고정한다. 4bit 는 판독이 무너진다(ADR-35 대안 ⓐ).
    model_id: "Qwen/Qwen2-VL-2B-Instruct"
    # 답 하나의 최대 길이. 닫힌 질문이라 «yes»·«no» 한 단어면 끝나고, 모델이 서술로
    # 샐 때를 위한 상한이다. 늘려도 답이 좋아지지 않고 지연만 는다.
    max_new_tokens: 32
    # 한 구역에서 질문 셋에 쓸 수 있는 시간. 넘으면 남은 항목을 묻지 않고 거기까지
    # 담아 돌려준다 — 통째로 버리면 가장 급한 `person_down` 까지 같이 잃는다.
    #
    # 3초로 잡은 근거 — 실측에서 질문당 0.20~0.22초라 셋이면 0.65초다(2026-09-20 ·
    # `TEST_MECHDOG/results/20260920_4.8.0-vlm-compare/`). 네 배 여유를 둔 값이며,
    # 모델이 서술로 답해 길어지는 경우까지 덮는다.
    budget_ms: 3000

  # ── 다중 인원 추적 (FR-3.6) ──
  tracker:
    # 이 값 이상 겹치면 같은 사람으로 잇는다. 낮추면 스쳐 지나는 두 사람의 ID 가
    # 서로 바뀌고, 높이면 빠르게 움직이는 사람이 매번 새 ID 를 받는다.
    iou_match_threshold: 0.3
    # 이 시간 동안 못 보면 ID 를 버린다.
    #
    # ⚠️ **프레임 수가 아니라 시간이다.** 원본 ByteTrack 은 `track_buffer=30 프레임`
    # 으로 정의하는데 그러면 의미가 추론률에 종속된다 — 같은 30프레임이 10fps 에서
    # 3초, 25fps 에서 1.2초다. 결정 22·25번과 같은 형태다.
    #
    # ⚠️ 늘리면 ID 가 오래 살아 인증 세션도 오래 산다(FR-3.6.2). 즉 이 값은 추적
    # 편의가 아니라 **인증을 얼마나 오래 신뢰하는가**의 값이다. 1초는 게이트의
    # 300ms 창보다 길어 깜빡임을 넘기고, 사람이 다른 사람으로 바뀌기에는 짧다.
    track_lost_ms: 1000

  # ── 다중 대상 처리 (FR-3.8) ──
  # 추적·인증은 개인별이지만 눈 LED 와 스피커가 하나뿐이라
  # 에스컬레이션 표현은 로봇 단위로 축약해야 한다.
  max_tracked_persons: 5       # FR-3.8.5 — 초과 시 bbox 큰 순 유지 + WARN
  # FR-3.8.2 — 주 대상은 가장 가까운(bbox 최대) 대상. 단일 기준이다.
  # 판정 결과(에스컬레이션 단계)를 기준으로 쓰면 순환 논리가 된다 —
  # 단계는 판정으로 올라가고 판정은 주 대상만 받으므로.
  primary_target_criterion: nearest
  primary_target_hold_ms: 2000 # FR-3.8.3 — 주 대상 최소 유지 시간
  primary_target_seq_lock: true # FR-3.8.3 — 시퀀스 진행 중 전환 금지 (히스테리시스보다 강함)

  # ── 스트림 ──
  # ── 사람 판정 (FR-3.2) — **시간 기반이다** ──
  # ⚠️ 예전에는 `detect_consecutive_frames: 3` 이었다. 프레임 수로 정의하면
  # **의미가 추론률에 종속된다** — 같은 "3프레임" 이 7fps 에서 429ms, 10fps 에서
  # 300ms, 25fps 에서 120ms 로 3.5배 달라진다. 즉 오검출 억제 강도와 확인 지연이
  # 한 값에 묶여, 추론률을 바꾸면 둘이 같이 흔들린다(결정 22번과 같은 형태).
  #
  # 실측 근거 (2026-09-10 · 실기 343프레임) — 10fps 에서 진짜 검출 구간 10개 중
  # **4개만** 조건을 채웠다. 25fps 에서는 10개 전부 인정되고 단발 8개가 전부
  # 막혔다(경계의 2연속이 0개). 짧은 구간(120~240ms)이 건너뛰기에 사라지기 때문이다.
  detect_window_ms: 300        # 이 시간 안에
  detect_hits_required: 3      # 이만큼 검출되면 사람으로 확정한다
  # ⚠️ 해제는 **창이 완전히 빌 때**만 한다. 진입과 대칭으로 두면 게이트가 경계에서
  # 떨린다. FSM의 TARGET_LOST는 이 해제와 별개로 마지막 실제 검출부터 5초를 센다.
  resolution: VGA              # VGA | QVGA (FR-5.3)
  # ⚠️ **요구 하한이지 실제 수신률이 아니다.** NFR-1.3 이 요구하는 최소값이며
  # 실제로 카메라가 보내는 값은 위의 `stream_fps_limit` 이다. 이 둘을 섞으면
  # 25fps 를 받는데도 문서·시험이 15fps 를 수신률로 믿는다.
  target_fps: 15               # NFR-1.3 하한 (실제 수신률은 stream_fps_limit)
  # 2026-09-10 실기 343프레임으로 다시 정했다 (10 → 25 = 수신률과 동일).
  #
  #   fps   진짜 구간 인정   단발 차단   추론 부하
  #    10        4 / 10          2        8.2%   ← 이전 값. 절반 이상 놓쳤다
  #    20        8 / 10          5       16.4%
  #    25       10 / 10          8       20.5%   ← 채택
  #
  # 20fps 에서 놓치는 둘은 **120ms 짜리 짧은 검출**이다 — 3회를 채우려면 관측이
  # 3개 들어가야 하는데 50ms 간격으로는 2개뿐이다. 수신률과 같게 두면 프레임을
  # 하나도 버리지 않으므로 그 구간이 살아난다.
  # ⚠️ 시간 창은 최대 관측 간격을 고정하지만, 확인 지연과 창 안의 히트 기회는
  # 여전히 추론률의 영향을 받는다. 이 값을 바꾸면 검출률·오검출률을 다시 잰다.
  inference_fps: 25
  reconnect_backoff_s: [1, 2, 4, 8, 16, 30]  # FR-5.3

localization:           # Track A(LiDAR) 확정 — OI-9 닫힘 (docs/DECISIONS.md ADR-18)
  # Phase 1 은 측위를 쓰지 않으므로 none 이다. Phase 2 에서 lidar 로 바꾼다.
  # phone_vio 는 탈락했으므로 허용값에서 제거했다 — 남겨 두면 누가 다시 넣는다.
  track: none                 # none | lidar | aruco
  settle_delay_ms: 750        # 정지 후 스캔 전 대기 (공통 원칙 4)
  move_increment_mm: 250      # 공통 원칙 5
  turn_increment_deg: 30      # 공통 원칙 5
  pose_timeout_ms: 500        # FR-6.6 — 초과 시 STATE_LOST

# ══════════════════════════════════════════════════════════════
#  에스컬레이션 (아키텍처 3.1) — FSM 상태와 직교하는 대응 강도 축
# ══════════════════════════════════════════════════════════════
escalation:
  l1_to_l2_hold_s: 10          # L1 관찰이 이만큼 지속되고 미인증이면 L2
  l3_requires_manual_reset: true
  multi_target_policy: max      # FR-3.8.1 — 전 대상 중 최고 단계를 로봇 단계로 채택  # L3·F 는 자동 해제하지 않는다
  led:                          # FR-10.4 — 눈 색깔로 단계 표시
    l0_patrol: blue
    l1_observe: yellow
    l2_auth_request: orange
    l3_alarm: red
    failsafe: white
    l3_blink_hz: 2
  sound:                        # FR-3.4 · WBS 3.5.6 — 단계 진입 시 읽어 줄 경고 문장
    # ⚠️ **문구 ID(정수)가 아니라 문장이다 (2026-09-23 결정).** 로봇에
    # `SOUND {phrase_id}` 를 보내는 설계는 버렸다 — 펌웨어가 그 명령을 파싱만 하고
    # 처리하지 않으며, ADR-31 이 WonderEcho 를 마이크·스피커로만 쓰기로 했다.
    # 읽는 것은 PC 의 음성 경로이고, 그래서 한국어 제약도 받지 않는다.
    #
    # ⚠️ **L2 문장은 여기 두지 않는다 (2026-09-23 정정).** 처음에는 여기에
    # 「사원증을 보여 주십시오」 를 적었는데 두 가지가 틀렸다. ① `auth.require_both`
    # 가 참이라 **암구호가 먼저**이고, 그 전에 보인 사원증은 판정조차 하지 않는다
    # (`runtime._judge_auth`) — 문장이 순서를 거꾸로 말했다. ② 음성 쪽
    # `Hub.auth_prompt` 가 같은 자리에서 이미 안내하므로 **두 문장이 겹쳐 나갔다.**
    #
    # 남은 한 문장을 음성 쪽에 두는 이유는 그 안내가 **시도 계수 게이트를 여는
    # 행위이기 때문이다** — `auth_prompted` 는 「우리가 물었다」 를 뜻하고 안내 전에
    # 녹음된 말은 시도로 세지 않는다. 문장만 이리로 옮기면 사건 폴링이 5초 주기라
    # **묻기 전에 게이트만 먼저 열리는 창**이 생긴다.
    l2_warning: null            # 음성 `Hub.auth_prompt` 가 말한다
    l3_warning: "경보가 발령되었습니다. 관리자에게 통보되었습니다."
    # L3 원인별 문장 — 키는 `{원인 사건 이름 소문자}_warning`. 없으면 `l3_warning` 을 읽는다.
    # ⚠️ TF 카드에 트랙이 하나 더 필요하다 (`4.7.21` 문장 표 · ADR-38).
    person_down_warning: "작업자가 쓰러졌습니다. 관리자에게 통보되었습니다."
    auth_granted: null
    ppe_violation: null

# ── 인증 (FR-10) ──────────────────────────────────────────────
auth:
  session_valid_s: 60          # FR-10.2.4 — 인증 유효 시간
  max_attempts: 2              # FR-10.3
  timeout_s: 30                # FR-10.3
  # 발화를 받아 둔 채 판정이 오는 중일 때 `timeout_s` 를 미뤄 주는 상한.
  #
  # ⚠️ **음성은 「말이 끝난 시각」과 「판정이 도착한 시각」이 다르다.** 파이프라인은
  # 녹음(최대 15초)·무음 1초·전사를 직렬로 하므로 방문객이 창 안에서 말해도
  # 판정이 30초를 넘겨 도착할 수 있다 — 2026-09-22 실기에서 통과 2건이 각각
  # 24초·18초를 썼다(여유 6초). 그래서 **발화가 시작된 것을 확인한 창 한 번에
  # 대해 이 시간만큼 한 번 미룬다.**
  #
  # ⚠️ **상한이 있고 창마다 1회다.** 무한정 멈출 수 있게 만들면 소리만 계속 내서
  # 로봇을 L2 에 영구히 붙들어 둘 수 있다 — 경보가 오지 않는 것이 경보보다 나쁘다.
  verdict_grace_s: 10          # FR-10.3 · ADR-37
  bind_to_track_id: false      # 실기: 추적 ID 불안정. 사원증 확인을 현장 인증으로 취급
  require_both: true           # 암구호 확인 뒤 새로 제시한 사원증까지 확인
  # ponytail: 60초 안에 사람이 바뀌면 새 사람도 인증 상태를 공유한다. 개인별 보안이 필요하면 추적·재인증으로 복귀.
  resume_delay_ms: 6000        # 사원증 감지→음성 상태 확인→복귀 안내 발화 동안 정지
  # 미등록 마커가 시도로 세어지기까지 필요한 안정 검출 횟수.
  # 1프레임 ArUco 오검출(없는 ID 가 배경에서 디코딩)이 인증 시도를 소진시키는
  # 것을 막는다 — 2026-09-13 실기에서 실제로 확인. 등록 마커는 이 게이트 없이
  # 즉시 인증한다.
  unknown_marker_min_frames: 3
  # FR-10.1 — 사원증에 인쇄할 ArUco 사전.
  #
  # ⚠️ **바꾸면 인쇄한 사원증도 바꿔야 한다.** 그래서 코드가 아니라 여기 둔다.
  # 비트가 적을수록 작게·멀리서도 읽힌다 — 사원증은 1~3m 에서 VGA 로 읽어야 하고
  # 필요한 ID 는 팀 규모만큼이므로 4x4·50개로 충분하다.
  badge_dictionary: DICT_4X4_50
  # FR-10.1 — ArUco ID -> 사번/이름. **여기 없는 ID 는 미승인이다.**
  # 시연용 두 장이며 실제 운용에서는 발급 대장이 정본이 된다.
  badge_marker_map:
    0: "EMP-001"
    1: "EMP-002"
  # FR-10.2 — 옛 WonderEcho 온칩 인식 ID 목록. 지금은 읽는 코드가 없다: 암구호는
  # PC 의 Whisper·규칙이 인식한다 (ADR-31, ADR-38). 키는 호환을 위해 남긴다.
  passphrase_command_ids: []

# ── 자세 상승 (FR-9.2.2) ──────────────────────────────────────
posture:
  # 2026-09-20 실측: 후진 300mm 는 앉은 자세의 시야 이득을 되돌리고 이동 위험만 더한다.
  escalation_steps: [pitch_up, sit]
  # ⚠️ 음수가 «고개를 드는» 쪽이다 (config `fsm` 절의 부호 각주 참고).
  # FR-9.2.2 는 카메라가 15cm 높이라 가까이서 머리가 잘리는 것을 자세로 푸는데,
  # 부호를 반대로 두면 **더 잘린다.**
  pitch_up_deg: -15
  settle_ms: 500               # 자세 변경 후 안정 대기 (POSE 의 `dur` 로도 쓴다)
  # `ALERT` 에 이만큼 머물러야 경계 자세를 잡는다. **`SCAN` 은 기다리지 않는다.**
  #
  # ⚠️ **0 으로 두면 고개가 올라가려다 멈추는 것을 반복한다.** `ALERT` 는 조준 중에
  # `TRACK` 과 왕복하는데 2026-09-18 실기에서 그 체류가 **0.2~0.6초**였다(10회).
  # 자세 보간(`settle_ms` = 500ms)이 끝나기 전에 중립이 오기 때문이며, 운용자가
  # *"고개를 들려다가 움직이고 들려다가 움직이고"* 로 관찰했다.
  #
  # ⚠️ **히스테리시스로는 못 막는다** — 진입·이탈 임계(50/40px)는 경계 «떨림» 을
  # 막는 장치이고, 여기서 일어나는 것은 검출 깜빡임으로 bbox 가 **실제로 크게**
  # 움직이는 것이다. 값이 진짜로 임계를 넘나든다.
  #
  # 1초인 근거 — 같은 런에서 왕복 체류가 **전부 0.6초 이하**였고, 조준이 끝나 안정된
  # `ALERT` 는 **7초**까지 머물렀다(2026-09-18 14:51). 그 사이다.
  alert_hold_ms: 1000
  back_off_mm: 300             # 3단계 후진 거리
  return_before_move: true     # FR-9.2.3 — 이동 전 기본 자세 복귀
  abort_on_target_lost: true   # FR-9.2.4 — 자세 상승 중 대상 이탈 시 즉시 중단·복귀

# ── 변화 감지 (FR-8) ──────────────────────────────────────────
change_detect:
  confirm_cycles: 2            # FR-8.4 — 연속 2사이클 동일 변화 시 확정
  person_immediate: true       # 단 person 출현은 즉시 처리
  snapshot_dir: snapshots
  # FR-8.1 "대략 위치" 를 담는 격자 [열, 행]. **성기게 둔다.**
  # 잘게 나누면 로봇이 몇 cm 달리 선 것만으로 같은 물건이 다른 칸에 잡혀
  # 반출과 반입이 동시에 보고된다. 정밀도가 아니라 재현성을 사는 값이다.
  baseline_grid: [3, 3]

# ── 구역 (FR-7 / FR-8) ───────────────────────────────────────
# ⚠️ 구역 "식별"은 ArUco 마커로 하며 측위와 무관하다 (바코드 읽기).
#    구역 "이동"은 측위가 필요하므로 Phase 2 이며 localization.track 에 종속된다.
zones:
  # FR-7.1 — 시연 규모에 맞춘다. 방 하나에서 하는 온라인 시연에는 2~3개가 적정하고
  # 5개는 화면상 구분이 어렵다. 구역이 늘면 마커도 그만큼 출력해야 한다.
  ids: [A, B, C]
  marker_map: {}               # FR-8 — ArUco ID -> 구역 라벨
  arrival_radius_mm: 300       # FR-7.4 (Phase 2)
  random_after_first_cycle: true  # FR-7.3

logging:                # NFR-3④
  level: INFO                 # DEBUG | INFO | WARN | ERROR
  format: jsonl
  dir: logs
  rotate_mb: 10
  rotate_keep: 5
  blackbox_dir: blackbox      # FR-3.9

# ══════════════════════════════════════════════════════════════
#  LiDAR 측위 · 매핑 · 구역 순찰 (FR-6 · FR-7 · Phase 2 · ADR-18)
#
#  단위는 **규약과 같다** — mm · deg · ms (PROTOCOL.md 2절). 내부 계산의
#  m · rad 로는 `host/common/units.py` 가 경계에서 한 번만 바꾼다.
#
#  ⚠️ 여기에는 **다른 절에 없는 값만** 둔다. 아래는 그대로 읽어 쓴다:
#       safety.obstacle_stop_cm · cmd_timeout_ms · link_loss_failsafe_ms
#       gait.step_length_mm · turn_angle_deg · reverse_distance_mm
#       localization.settle_delay_ms · move_increment_mm · pose_timeout_ms · track
#       zones.ids · arrival_radius_mm · random_after_first_cycle
#       network.cmd_port · telemetry_port · cmd_rate_hz  ·  fsm.avoid_attempts
#     같은 값을 두 곳에 두면 언젠가 한쪽만 고쳐지고, 그때 **어느 쪽이 실제로
#     쓰이는지 코드를 읽어야 알 수 있다.**
# ══════════════════════════════════════════════════════════════

lidar:
  # ── 중계 노드 링크 (ESP32 DevKit → Host PC · UDP) ─────────────
  # 제어(5001)·텔레메트리(5101)와 **다른 포트**여야 한다. 같이 쓰면 한 소켓에
  # 두 스키마가 섞여 들어와 서로를 "모르는 타입"으로 폐기한다.
  scan_port: 5201
  # 이 시간 동안 스캔이 없으면 LiDAR 링크 두절로 본다.
  # ⚠️ `safety.link_loss_failsafe_ms` 와 **의도적으로 다른 값이다.** 로봇 링크
  # 두절은 안전 문제이고, LiDAR 두절은 측위 능력의 상실이라 `LOST` 로 간다.
  # 비전의 `stall_timeout_ms` 가 같은 이유로 안전 절 밖에 있다.
  scan_stall_timeout_ms: 1500

  # ── 센서 유효 범위 ────────────────────────────────────────────
  # 하한은 로봇 몸통 반사를 걸러내고, 상한은 정합이 성립하는 거리다 —
  # 넓은 공터에서는 벽이 안 잡혀 스캔 정합이 무의미해진다 (ADR-18 각주).
  # ⚠️ 12m급 제품이 확정되면(OI 진행 중) 상한을 실측 유효 사거리로 고친다.
  range_min_mm: 120
  range_max_mm: 8000
  # 정지 상태에서 몇 장을 모아 중앙값으로 합칠지 (ADR-7).
  scan_batch: 3

  # ── 점유격자 ─────────────────────────────────────────────────
  # 5cm 는 로봇 폭(약 20cm) 대비 4셀이라 문틈을 구분하고, A* 격자가
  # 10m x 10m 에서 200x200 으로 남아 완전 탐색이 감당된다.
  resolution_mm: 50
  initial_span_cells: 200      # 200 x 50mm = 10m. 경계에 닿으면 자동 확장한다
  expand_pad_cells: 60         # 확장할 때 붙이는 여유 (매 사이클 재할당 방지)
  # 로그오즈 가중치. 점유를 자유보다 크게 두는 이유 — 벽은 한 번 봐도 벽이지만
  # 빈 공간은 여러 번 통과해야 확신할 수 있다. 반대로 두면 벽이 지워진다.
  hit_logodds: 0.9
  miss_logodds: -0.4
  occupied_logodds: 1.0        # 이 값 이상이면 막힌 셀
  free_logodds: -1.0           # 이 값 이하만 **확실히 빈** 셀 (미관측과 구분)

  # ── 스캔 정합 (측위) ──────────────────────────────────────────
  # 탐색 반경 = localization.move_increment_mm x 이 비율. 한 사이클 이동량보다
  # 좁으면 정상 이동을 놓치고, 넓히면 탐색이 제곱으로 커진다.
  search_span_ratio: 0.6
  search_step_mm: 40
  search_angle_deg: 8
  search_angle_step_deg: 2
  # 이만큼 관측된 셀이 있어야 정합을 시도한다. 빈 지도에 정합하면 점수가 전부
  # 0 이라 탐색 격자의 첫 후보가 우연히 채택된다.
  min_known_cells: 50

  # ── 경로 계획 ────────────────────────────────────────────────
  # 로봇 실측 폭의 절반. ⚠️ `2.2.1` 실측 후 확정한다.
  robot_radius_mm: 150
  # 경로 추종 오차를 위한 **추가** 여유. 팽창은 `robot_radius_mm + 이 값`이다.
  #
  # ⚠️ **0 으로 두면 안 된다.** 팽창이 로봇 반경과 같으면 경로 중심선이 벽에서
  #    정확히 반경만큼 떨어져 지나가고, 그 위를 완벽히 걸어도 LiDAR 가
  #    `estop_distance_mm` 를 읽는다 — **정상 순찰이 비상정지로 끝난다.**
  #    실제로 겪었다 (반경 150 = E-STOP 150 → 한 사이클에 E-STOP 6회).
  #    호 조향밖에 없는 로봇에 추종 오차 0 을 요구할 수 없다 (DR-11).
  tracking_margin_mm: 100
  path_simplify_mm: 80         # 웨이포인트 단순화 허용 오차
  waypoint_radius_mm: 100      # 중간 웨이포인트 통과 판정 (도착은 zones.arrival_radius_mm)
  # 방위 오차가 이 안이면 직진한다. 좁히면 호 조향밖에 없는 로봇이 진동한다.
  heading_tolerance_deg: 8
  # 이 이상 틀어져 있으면 전진 호로 돌아설 수 없어 후진 호로 바꾼다 (DR-11).
  reverse_threshold_deg: 90

  # ── 신규 장애물 ──────────────────────────────────────────────
  # 이 거리 안의 빔만 후보로 본다. 측위 오차가 거리에 비례하므로 멀리서
  # 판정하면 오탐이 늘고, 오탐 하나가 통로를 막는다.
  new_obstacle_check_radius_mm: 1500
  new_obstacle_margin_mm: 250     # 측위 오차 여유. 좁히면 벽을 신규 장애물로 본다
  new_obstacle_confirmations: 2   # 연속 확인 횟수 (change_detect.confirm_cycles 와 같은 발상)
  obstacle_mark_radius_mm: 300    # 동적 마스크에 찍을 반경 (로봇 반경 + 여유)

  # ── 호스트측 위험 판정 ───────────────────────────────────────
  # ⚠️ **온보드 초음파(safety.obstacle_stop_cm)를 대체하지 않는다.** 초음파는
  #    정면 근거리만 보고(DR-15) Tier 1 이며, 이 값은 LiDAR 가 보는 360° 중
  #    전방 부채꼴에 대한 **호스트의 추가 판정**이다. 둘 중 먼저 걸리는 쪽이
  #    이긴다. 온보드 임계(25cm)보다 짧게 두어 온보드가 먼저 반응하게 한다.
  #    ⚠️ **`robot_radius_mm + tracking_margin_mm` 보다 작아야 한다.** 크면
  #    계획된 경로 자체가 E-STOP 거리를 지나간다 (위 `tracking_margin_mm` 각주).
  #    `settings._validate` 가 기동 시에 확인한다.
  estop_distance_mm: 100
  forward_fan_deg: 20             # 전방으로 볼 부채꼴 반각

  # ── 시뮬레이션 (실기 연결 전 검증 · WBS 12절) ─────────────────
  # ⚠️ 이 값들은 **실측이 아니다.** `gait_calibration.forward_mm_per_sec` 가
  #    채워지면 그것을 쓴다. 지금 여기 있는 것은 알고리즘을 돌려보기 위한
  #    명목값이며, 이 숫자로 실기 성능을 말하지 않는다.
  sim:
    forward_mm_per_sec: 200       # 명목. 실측은 gait_calibration 소관
    turn_deg_per_sec: 25          # 명목
    scan_noise_mm: 10
    dropout_rate: 0.02            # 빔 유실률
    beams: 360

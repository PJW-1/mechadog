# 개체 프로파일 — mechdog-03 (자리만 있다 · 실물 미입고)
#
# ⚠️ **아직 실물이 없다 (2026-09-23).** 다중 개체 관제(`host.fleet`)가 세 번째 자리를
# 갖도록 만든 틀이다. 관제 화면은 `telemetry_device_id` 가 비어 있으면 «미등록» 으로
# 표시한다.
#
# 실물이 오면 채울 것:
#   ① 부팅 UART 의 `Telemetry identity:` 줄 → `telemetry_device_id`
#   ② `2.4.2` 에서 확정한 주소 → `network.mechdog_ip` · `network.xiao_ip`
#   ③ 이 기체에서 잰 `servo_offset` · `gait_calibration`
#
# ⚠️ **`mechdog-01`·`mechdog-02` 의 값을 복사하지 않는다.** 서보 비대칭과 직진 편향의
# 방향까지 개체마다 다르다(`mechdog-02.yaml` 머리말).
#
# 그때까지는 텔레메트리 `device_id` 가 설정 이름(`mechdog-03`)과 같은 것만 받는다 —
# 목업(`tools/mock_mechdog.py --device mechdog-03`)이 그렇게 보낸다.

device_id: mechdog-03
owner_id: unassigned

telemetry_device_id: null

reference_role: none

network:
  mechdog_ip: null
  xiao_ip: null
  cmd_port: 5001
  telemetry_port: 5101

servo_offset: null

# 실측 전 — 없으면 회피 시퀀스를 만들지 않고 정지를 유지한다 (`host/behavior/actions.py`).
gait_calibration: null

measured:
  body_weight_g: null
  payload_pass_g: null
  runtime_min: null
  wifi_rssi_dbm: null
